###########################################################################
# Guerra do Emperium - ajustes nossos nos grupos de jogador.
#
# Este arquivo e VERSIONADO e vale para qualquer clone do repo. Ele e
# importado pelo rodape de conf/groups.yml, ANTES de conf/import/groups.yml
# - ou seja, o conf/import continua podendo sobrescrever qualquer coisa
# daqui, por maquina.
#
# COMO O MERGE FUNCIONA: o leitor de grupos procura o Id antes de criar
# (PlayerGroupDatabase::parseBodyNode, src/map/pc_groups.cpp:74). Se o
# grupo ja existe - e o Id 0 existe, vem do conf/groups.yml - ele NAO e
# recriado: os campos deste arquivo sao aplicados por cima. Por isso aqui
# nao ha Name nem Level, e o que esta escrito e so a diferenca.
#
# ATENCAO A UMA ARMADILHA DO ARQUIVO ORIGINAL (CLAUDE.md secao 5):
# em conf/groups.yml, `false` NAO desliga nada que venha por HERANCA - a
# heranca e um OU binario aplicado depois do parse. Tirar comando so
# funciona no grupo que o concede.
#
# Recarrega com @reloadatcommand (que chama pc_groups_reload,
# src/map/atcommand.cpp:4422). NAO e @reloadscript nem @reloadbattleconf.
###########################################################################

Header:
  Type: PLAYER_GROUP_DB
  Version: 1

Body:
  # ---------------------------------------------------------------------
  # Id 0 - "Player", o grupo de TODA conta nova.
  #
  # AUTOLOOT PARA TODOS, decisao do dono em 2026-08-16. Ate aqui os tres
  # comandos so existiam no grupo 1 ("Super Player"), que nenhuma conta de
  # jogador tem - na pratica o autoloot nao existia neste servidor, e a
  # unica pista era o "Unknown Command" na tela, que nao diz falta de
  # permissao (CLAUDE.md secao 3).
  #
  # Sao TRES comandos porque sao tres formas do mesmo recurso, e o rAthena
  # as trata separadamente:
  #
  #   @autoloot <0-100>   tudo que cair, ate a porcentagem dada
  #   @alootid <item>     so um item, por nome ou ID (ate 10 na lista)
  #   @autoloottype <tp>  so uma categoria (cartas, curas, ...)
  #
  # Nenhum deles vem LIGADO: o jogador digita quando quiser e o estado vale
  # ate o logout. Ligar sozinho no login exigiria um OnPCLoginEvent com
  # atcommand, e nao foi o pedido - quem quiser autoloot, pede.
  # ---------------------------------------------------------------------
  - Id: 0
    Commands:
      autoloot: true
      alootid: true
      autoloottype: true

  # ---------------------------------------------------------------------
  # Id 20 - "Fantasma", a conta de bot da Arena de Combate.
  #
  # E o perfil da conta que o openkore usa em plugins/pvpGhost. Ele nao
  # e staff: e um NPC de carne, que fica invisivel dentro de pvp_n_1-5 e
  # aparece quando ha um jogador sozinho por perto.
  #
  # POR QUE ELE PRECISA DE UM GRUPO PROPRIO, E NAO DO Id 10: sao dois
  # comandos, so. Dar "Law Enforcement" para uma conta que roda sozinha
  # 24/7 num processo perl entregaria junto @kill, @ban, @recall
  # e o resto - qualquer descuido no openkore vira estrago no
  # servidor inteiro. Aqui a conta nao consegue fazer nada alem de
  # sumir e andar.
  #
  # Level 0 DE PROPOSITO. O Level nao e enfeite: entra nas comparacoes
  # de hierarquia do rAthena (src/map/clif.cpp, pc_get_group_level nas
  # linhas de sussurro e de @who). Com 0 o bot fica embaixo de todo
  # mundo da staff de verdade - qualquer GM continua vendo, movendo e
  # expulsando ele. E o Level NAO acende aura nem nome amarelo no
  # cliente: o rAthena nunca manda esse campo no pacote de ator, o
  # visual de GM vem so da roupa/sprite equipada. Este bot nao veste
  # nada de GM, entao aparece como um jogador comum - que e o ponto.
  #
  #   hide          o @hide, o unico truque do fantasma. E ALTERNADOR:
  #                 mandar duas vezes desfaz (ACMD_FUNC(hide),
  #                 src/map/atcommand.cpp) - o plugin le OPTION_INVISIBLE
  #                 antes de mandar, justamente por isso.
  #   hide_session  tira ele do @who. Sem isto o "fantasma" aparece na
  #                 lista de quem esta online e a brincadeira acaba.
  #   mapmove       o @warp de volta para a arena. Necessario porque
  #                 pvp_n_1-5 tem `mapflag nosave SavePoint`
  #                 (npc/mapflag/nosave.txt) e o OnPCDieEvent da arena
  #                 joga o morto em prontera: sem @warp o bot morre uma
  #                 vez e nunca mais volta.
  #   any_warp      nao e preciso hoje - pvp_n_1-5 nao esta em
  #                 nowarpto.txt nem nowarp.txt - e esta aqui para o dia
  #                 em que alguem trancar o mapa e o bot parar calado.
  #
  # A conta se liga a este grupo pela coluna `group_id` da tabela
  # `login`. Recarrega com @reloadatcommand, como o resto deste arquivo.
  # ---------------------------------------------------------------------
  - Id: 20
    Name: Fantasma
    Inherit:
      Player: true
    Level: 0
    LogCommands: true
    Commands:
      hide: true
      mapmove: true
    Permissions:
      hide_session: true
      any_warp: true
