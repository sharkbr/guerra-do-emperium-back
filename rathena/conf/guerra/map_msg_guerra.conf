//--------------------------------------------------------------
// Guerra do Emperium - mensagens do map-server em portugues.
//
// Este arquivo e VERSIONADO e vale para qualquer clone do repo.
// Ele e importado por conf/msg_conf/map_msg.conf, logo antes de
// conf/msg_conf/import/map_msg_eng_conf.txt - ou seja, o import
// da maquina continua tendo a ultima palavra.
//
// Sao as mensagens que o SERVIDOR manda para a caixa de chat:
// resposta de comando @, aviso de peso, recusa de negociacao,
// erro de guilda. O texto que vem do CLIENTE (item, habilidade,
// quest, janela) nao passa por aqui - aquele lado e o
// ferramentas/traduz_ptbr.py.
//--------------------------------------------------------------

// Por que nao mexer no langtype do rAthena
// -----------------------------------------
// O rAthena tem um sistema de idioma proprio: `@langtype por`
// troca a lingua por jogador. Nao serve aqui por dois motivos.
//
// 1. Ele vem DESLIGADO em tempo de compilacao. `LANG_ENABLE` e
//    0x000 em src/common/msg_conf.hpp, e ligar o portugues
//    (0x80) obrigaria a recompilar o map-server.
// 2. Mesmo ligado, o padrao de todo personagem continua sendo o
//    ingles (langtype 0). Cada jogador teria que digitar
//    `@langtype por` na primeira vez.
//
// Como o servidor e so em portugues, sai mais barato trocar o
// conteudo da tabela padrao. Uma linha de import faz isso: o
// leitor de mensagens do rAthena e recursivo e sobrescreve por
// numero (src/common/msg_conf.cpp, _msg_config_read), entao o
// que vier depois vence. O ingles e lido primeiro e serve de
// reserva para as mensagens que a traducao ainda nao cobre.

// A traducao pt-BR que o proprio rAthena ja distribui: 1276 das
// 1278 mensagens. As duas que faltam ficam em ingles, e e o
// comportamento certo - ID sem linha aqui mantem o valor lido
// antes.
import: conf/msg_conf/map_msg_por.conf

//--------------------------------------------------------------
// Correcoes e mensagens nossas
//
// Daqui para baixo entra o que quisermos mudar por cima da
// traducao do rAthena. Formato: `<numero>: <texto>`.
// O arquivo esta em Latin-1 (ISO-8859-1), como todos os
// map_msg_*.conf do rAthena - gravar em UTF-8 faz cada acento
// virar dois bytes e sair lixo na tela.
//--------------------------------------------------------------

// Teto de refino. Quem manda esta mensagem e o
// src/custom/refino.hpp, quando o jogador poe na janela de refino
// um item que ja bateu no refino_teto do
// conf/guerra/battle_guerra.txt.
//
// A faixa 1550+ e nossa: o rAthena para na 1540 e o teto da tabela
// foi subido para 1600 no src/custom/defines_pre.hpp.
1550: Refinos acima de 16 trazem maus presságios. Vá embora!
