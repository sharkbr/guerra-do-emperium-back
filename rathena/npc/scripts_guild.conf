// GUERRA DO EMPERIUM - DEZENOVE DOS VINTE CASTELOS ESTAO DESLIGADOS
//
// Decisao do dono em 2026-08-13: o servidor comeca com UM castelo conquistavel,
// o Kriemhild (prtg_cas01). Os outros dezenove viram campo de treino - sem
// Emperium, sem dono, sem Kafra, sem Gerente do Castelo, sem bau, e sem os
// Evil Druid/Khalitzburg que o agit_main.txt planta em castelo vazio.
//
// Desligar aqui e o que apaga TUDO isso de uma vez, porque cada um destes
// arquivos e so um punhado de `duplicate` do agit_main.txt. Em especial e o que
// tira o Emperium: ele nasce no `OnAgitStart` do NPC `Agit#<castelo>`, que e uma
// dessas duplicatas - sem o arquivo, nao ha `OnAgitStart` para aquele castelo e
// a guerra simplesmente nao acontece la.
//
// Quem enche os dezenove de guardiao e npc/guerra/guardioes_dos_castelos.txt,
// que nao depende de nada daqui.
//
// PARA DEVOLVER UM CASTELO A GUERRA: descomentar a linha dele. Nada mais.
// Convem tirar tambem o mapa correspondente do NPC nosso, senao os guardioes
// de defesa 100 continuam por cima dos guardioes de verdade.
//
// A Guerra do Emperium 2 (guild2, os dez castelos de Arunafeltz e Schwarzwald)
// ficou INTOCADA neste pedido - "vamos comecar com a 1.0 primeiro".

