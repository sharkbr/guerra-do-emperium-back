// O ENCANTAMENTO DA ORDEM, o segundo servico do salao de auction_02 e o
// unico que mexe em peca que o jogador ja tem. Um NPC so:
//
//   Lider  43,65, sprite 898 (4_M_HUMAN_01). Poe UM encanto por vez em
//          capa, calcado ou acessorio da lista do bRO - onze pecas -, e
//          reseta todos de uma vez. Cobra 10 Moedas do Explorador mais
//          100.000 zeny nas duas coisas, que e o preco do browiki.
//
// Fica no fundo NORTE do salao, no vao do pilar central. A celula ja
// estava livre: e a do `Auction Broker#lhz3`, que o OnInit do
// ordem_dos_exploradores.txt desliga - ou seja ESTE ARQUIVO DEPENDE
// DAQUELE, e comentar a linha de cima empilha o Broker aqui de volta.
//
// O encanto e uma CARTA gravada nas covas 4, 3 e 2 da peca, de tras para
// frente, deixando a cova 1 para carta de verdade - o arranjo oficial, o
// mesmo dos encantadores do proprio rAthena. Nao ha campo de item_db
// nisso, e por isso a peca sai e volta por delequip + getitem4, levando
// de volta refino, covas, vinculo, grau de encanto e bonus aleatorio.
//
// TETO POR TIPO, do bRO: capa e calcado ate 3 encantos, acessorio ate 2 -
// e acessorio so conta no lado DIREITO.
//
// CHANCES IGUAIS, por decisao do dono em 2026-08-28: dentro dos 80% de
// sucesso, toda pedra da coluna daquele tipo tem o mesmo peso - 8,33% no
// calcado (12 pedras), 5,55% no acessorio (18) e 6,25% na capa (16). O
// REFINO NAO INFLUI EM NADA. A regra 7 do browiki ("refinados no +9
// garantem encantos melhores, indicados em negrito") NAO foi
// implementada: a primeira versao a leu como troca de faixa e uma capa +9
