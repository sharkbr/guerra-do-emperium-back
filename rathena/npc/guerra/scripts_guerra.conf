//            placa que manda o jogador procurar a Alleria.
//   Guardas  comodo 221,184 e 224,184, sprite 966 (4_M_RUSKNIGHT), um
//            atras de cada. So falam. As DUAS FALAS CITAM O SERVIDOR VAZIO -
//            sao metalinguagem, e vao querer ser reescritas no dia em que o
//            servidor encher.
//
// Com isto o circuito fecha: o Corredor da a flor (30% por chefe), a Alleria a
// troca por moeda, e a Maquina de comodo 214,185 gasta a moeda ali mesmo.
//
// NAO E A TROCA DO bRO (10 Flores por um Premio Visionario, com sorteio de
