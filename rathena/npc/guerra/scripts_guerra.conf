// AS DUAS MAQUINAS DE SOMBRIOS, lado a lado no Centro da Ordem, na faixa
// aberta a nove e a treze celulas a leste da boca do corredor de chegada. As
// duas viradas para a esquerda (facing 4), entao a segunda olha para a
// primeira:
//
//   Sombrios Totais  auction_01 189,58, sprite 10375 (4_VENDING_MACHINE2), um
//                    cilindro de vidro sobre coluna. SORTEIA.
//   Sombrios Gerais  auction_01 193,58, sprite 910 (2_COLAVEND), a maquina de
//                    refrigerante vermelha. VENDE, a preco fixo.
//
// A TOTAIS E A PRIMEIRA MAQUINA DE SORTEIO DO SERVIDOR. Custa 2 Moedas Novas o
// giro e devolve UM de quatro itens do ramo Sombrio, com peso: Caixa de
// Sombrios de Atributo (15/34), Martelo de Refino Sombrio (15/34), Combinador
// de Atributo (3/34) e Martelo Sombrio +9 (1/34).
//
// A GERAIS NAO SORTEIA, e de proposito: ela vende os tres Cubos de Materiais
// Sombrios (100690, 23335, 23663) a 2 moedas e o Combinador de Sombrios
// (22529) a 1. Cubo JA e "abre e sai coisa aleatoria" - o sorteio esta dentro
// do item, e sortear de novo do lado de fora seria sortear duas vezes.
//
// E DAI QUE SAI A FORMA DE CADA UMA: sorteio exige `rand`, e loja de troca nao
// roda script nenhum - por isso a Totais e script puro, sem loja. Preco fixo em
// ITEM exige barter e nao itemshop (a Moeda Nova e NoSell, regra 4.10) - por
// isso a mercadoria da Gerais vive em npc/guerra/barters_guerra.yml, na loja
// flutuante `SombriosGerais#loja`, e mudanca la pega com @reloadbarterdb.
//
// Consequencia que separa as duas, e vale saber: na Totais o nome do item na
// tela sai do `getitemname()`, que le o item_db do SERVIDOR; na Gerais sai do
// itemInfo.lua do CLIENTE, porque o pacote do barter leva so o ID (regra 4.9).
// Nome errado numa nao se conserta do mesmo jeito que na outra.
//
// Os oito itens ja existiam no rAthena, com nome PT no itemInfo.lua e arte 4 de
// 4 - nada foi criado no db/ para esta dupla.
//
// COM ELAS A MOEDA NOVA GANHA O QUARTO E O QUINTO DESTINO, depois das duas
// Maquinas (maquina.txt) e da Maquina de Troca do auction_02 - e do outro lado
// do balcao, o Egebreu, que a paga.
//
// O SPRITE PEDIDO PARA A TOTAIS NAO EXISTE NESTE CLIENTE. O pedido apontou o
// `4_GACHA_MACHINE` (10545 no npc.hpp), e o npcidentity.lub do nosso data.grf
// para em 10508 na faixa 10xxx - nem o GRF do bRO o tem. O 10375 foi escolhido
// pelo dono entre os seis sprites de maquina que este cliente conhece, e evita
// repetir o 564 que ja serve a tres NPCs. O cabecalho do arquivo lista os seis.
//
// A tabela de premios da Totais (id + peso) vive em dois `setarray` do OnInit e
// e a unica fonte da lista na tela, da porcentagem impressa e do sorteio -
// regra 4.11. Mudar premio e mexer nas duas linhas juntas, e em mais nada.
//
// Comentar a linha abaixo tira AS DUAS do salao. A loja da Gerais NAO sai
// junto: ela e carregada pelo npc/barters.yml e fica sem porta, existindo sem
// que ninguem a alcance - o mesmo caso da Maquina de Prontera.
npc: npc/guerra/maquina_de_sombrios.txt

// O CASSINO DE COMODO, a "Casa Rosa" - cmd_in02, os dois saloes de jogo do
// mapa de interiores. Tres recepcionistas nas portas (211,100 e a dupla de
// 173-174,131), quatro garconetes que oferecem um drink que transforma em
