// assim que um tronco de arvore virou "destroco de construcao".
// Gerado por ferramentas/catalogo_ingame.py. Comentar quando nao estiver em uso.
//
// DESLIGADO em 2026-07-31, terminada a rodada de Izlude. Para religar:
