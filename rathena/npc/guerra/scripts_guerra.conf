// AS MISSOES DIARIAS DE CACADA EM INSTANCIA, e o braco de exploracao da mesma
// Ordem do Emissario e da Alleria. Onze pecas, todas no salao de auction_02:
//
//   Opheliac    44,41, sprite 894. A TROCA DE MOEDAS: dezoito equipamentos e
//               dez consumiveis por Moeda do Explorador, nos precos do bRO. A
//               mercadoria vive em npc/guerra/barters_guerra.yml
//               (`Opheliac#loja`). No bRO ela tambem faz transformacao de
//               visual e encantamento do Robozinho; as duas ficaram de fora -
//               sao janela do CLIENTE, e nenhuma esta montada aqui.
//   2 guardas   38,28 e 49,28, sprite 966 (4_M_RUSKNIGHT) - o mesmo dos dois
//               Guarda da Ordem de Comodo. So falam, uma fala cada.
//
//   3 placas    59,34 / 59,36 / 59,38, sprite 837. Missoes A, B e C. Cada uma
//               da um lote de cacadas (7, 3 e 4) e paga em Moeda do Explorador
//               (25737) mais EXP de base e de classe. Pegar e entregar sao em
