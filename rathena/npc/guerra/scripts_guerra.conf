// A Anomalia Dimensional: o evento dos pets de MVP.
//
// Fala-se com o Sabio Varmunt (prontera 156,303, nivel 60+), ele abre uma
// fenda, e do outro lado ha uma copia de Prontera - o mapa `pprontera`,
// que ja existia no cliente, vazio de NPC - com quatro Pedras Guardias
// moribundas. As Pedras nao se defendem e nao se quebram: elas precisam
// ser CURADAS, com Curar, Curatio ou Santuario, enquanto Entidades
// Sombrias nascem de dez em dez segundos e, raramente, um MVP atravessa
// junto (com anuncio para o servidor inteiro). Curadas as quatro, Varmunt
// paga 7 Moedas de Estimacao, uma vez por dia, com virada as 4 da manha.
//
// CURAR MONSTRO FUNCIONA, e essa e a descoberta que fez o evento caber em
// script: o SkillHeal::castendNoDamageId (src/map/skills/acolyte/heal.cpp)
// so zera a cura para o Emperium, para `Class: Battlefield` e para alvo
// imune - em qualquer outro monstro ele chama status_heal de verdade. O
// Santuario tem os mesmos tres testes. Nenhuma linha de C++ nosso entrou.
// A Pedra e o mob 1907 (S_EMPEL_1, o Guardian Stone da Guerra do Emperium
// 2.0) porque ele e Neutro e sem Raca - morto-vivo receberia DANO em vez
// de cura -, porque `Ai: 06` o deixa com os modos zerados, e porque
// nenhum script do servidor o usa.
//
// A OUTRA METADE E A MAQUINA DIMENSIONAL (prontera 165,304): 10 Moedas de
// Estimacao por um sorteio de 58 premios, e e de la que saem os ovos -
// do Ovo de Freeoni, o mais raro, aos doze ovos comuns, mais as iscas de
// captura e a comida de bicho. As chances sao as do bRO escaladas por
