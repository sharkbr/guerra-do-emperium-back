//               seguinte, e so a ENTREGA espera as 6h da manha.
//   Teleportador  37,39, sprite 10007. Leva a PORTA de qualquer uma das catorze
//               instancias por 5.000z - nao para dentro, que o gate de nivel e
//               de espera continua sendo da NPC de entrada de cada uma.
//   Maquina de Troca  50,39, sprite 564, o mesmo da Maquina de Prontera. Troca
//               10 Moedas do Explorador por 1 Moeda Nova. A mercadoria vive em
//               npc/guerra/barters_guerra.yml (`Ordem#loja`) - mudanca la pega
