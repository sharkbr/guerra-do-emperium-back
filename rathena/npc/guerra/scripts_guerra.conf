// A LOJA DA MOEDA NOVA. SAO DUAS MAQUINAS desde 2026-08-08, e a segunda e um
// `duplicate` da primeira - mesmo codigo, mesmo sprite, mesma loja:
//
//   prontera 167,199   a original, abrindo a fila com o Edgard e o Xanin (os
//                      tres em y=199), a duas celulas da quina do quarteirao
//   comodo   214,185   na cena do Corredor Fantasma, ao lado da Alleria e do
//                      Saback - assim quem vende flor gasta a moeda ali mesmo
//
// Ate 2026-08-07 ela era uma fala so ("a maquina nao funciona") e o arquivo se
// chamava maquina_quebrada.txt.
//
// E o PRIMEIRO NPC que cobra a Moeda Nova (30998). Ainda em 2026-08-07 ela
// passou de MENU para LOJA DE TROCA (barter) - a janela nativa do cliente, com
// o icone de cada item e o da Moeda em cada linha, e "comprar varios de uma
// vez". E a mesma janela da loja de pedras de Malangdo.
//
// ESTE ARQUIVO NAO TEM MAIS A LISTA. Sao dois NPCs agora, e a mercadoria vive
// no outro:
//
//   maquina.txt          a fala, o corpo, o sprite. Chama a loja com callshop.
//   barters_guerra.yml   a loja `Maquina#loja`, FLUTUANTE (sem mapa, invisivel),
//                        com as dezoito linhas e uma nota por linha.
//
// Desligar esta linha tira a maquina do mapa mas NAO tira a loja - ela e
// carregada pelo npc/barters.yml, nao daqui. Sem este NPC a loja fica sem porta:
// existe, e ninguem a alcanca.
//
// POR QUE BARTER E NAO `itemshop`: a Moeda Nova e `NoSell`, e o itemshop passa a
// moeda por `pc_can_sell_item`, que recusa item NoSell - a compra falharia com a
// moeda na mao do jogador. O barter nao faz essa checagem. O registro completo
// esta no cabecalho do barters_guerra.yml.
//
// A trava que moldou a lista: o barter cobra POR UNIDADE, entao todo pacote
// virou CAIXA (um item que entrega N ao ser usado). Quinze ja existiam no bRO
// prontas; duas foram feitas por nos (30997 e 30996, db/guerra/item_db.yml).
//
// Metade da lista sao cupons de estilista, que NENHUM script consome - quem os
// gasta e a UI do cliente (db/re/stylist.yml, via src/map/clif.cpp), com duas
// ressalvas sobre cupom que pode ser consumido sem mudar nada na tela.
npc: npc/guerra/maquina.txt

