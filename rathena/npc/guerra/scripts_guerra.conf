npc: npc/guerra/porteiro_do_treinamento.txt

// A porta da arena de PvP, em prontera 157,187 - tres celulas a leste do
// porteiro acima, onde ficava a "Smile Assistance". Pergunta uma coisa so e
// leva para pvp_n_1-5, a "Sala Bussola". O `mapflag pvp` do mapa e do proprio
// rAthena; este NPC so transporta.
//
// Mesma receita DE FORA das outras: disablenpc na duplicata do rAthena mais
// este NPC na coordenada, com o npc/quests/mrsmile.txt byte a byte igual ao
// upstream. As outras CINCO Smile Assistance (Alberta, Al De Baran, Geffen,
// Ruinas de Morroc e Payon) continuam de pe.
//
// QUEM MORRE VOLTA PARA PRONTERA 155,183, a celula em que o Warper desembarca,
// quatro passos da porta. E script (OnPCDieEvent), nao mapflag: o `nosave` nao
// alcanca morte - o pc_respawn vai direto para o save_point do personagem.
// Quem nao morre continua saindo deslogando; o mapa e `noteleport`.
//
// O arquivo traz junto DUAS LINHAS DE MAPFLAG em pvp_n_1-5:
// `pvp_nightmaredrop off`, que desliga o drop de equipamento na morte, e
// `pvp_nocalcrank`, que desliga o contador de PvP embutido do rAthena - sem
// ele o jogador e expulso para o ponto de retorno na segunda morte, brigando
// com o respawn acima. O cabecalho do arquivo explica os dois. O rAthena entrega as
// arenas pvp_n_* com 3% de chance de o morto largar uma peca no chao; aqui nao
// se perde patrimonio. Vale so para esta arena, e depende de o
// scripts_custom.conf ser lido depois do scripts_mapflags.conf - o cabecalho
// do arquivo explica. Comentar esta linha devolve a Smile Assistance E o drop.
npc: npc/guerra/arena_de_combate.txt

// A Honra de Combate: a reputacao de PvP da arena acima. Matar em pvp_n_1-5
// da um ponto, morrer tira um, e a conta vale PARA A CONTA (o `#` do Variable
// em db/guerra/reputation.yml), nao para o personagem.
//
// Sao TRES pecas que precisam do mesmo Id 5, e mexer numa sem as outras
// quebra calado:
//   db/guerra/reputation.yml         o Id, a variavel e os limites
//   data\contentdata\repute\*.bson   o NOME que o jogador le, no cliente
//                                    (ferramentas/traduz_reputacao.py)
//   este arquivo                     as regras e o placar
//
// O RANKING NAO CABE NO MODAL - o pacote ZC_REPUTE_INFO nao tem campo de
// texto, entao o servidor nao consegue mandar nome de jogador. Por isso o
// arquivo tambem planta uma PLACA em prontera 163,187 (sprite 20269) com os
// 20 primeiros. O cabecalho do arquivo explica por extenso.
//
// EXIGE DUAS TABELAS: rodar sql-files/guerra_arena_pvp.sql antes de subir.
// Sem elas o query_sql falha e ninguem pontua - o anuncio de morte continua
// saindo, que e o sintoma que vai aparecer primeiro.
//
// E EXIGE REINICIAR O MAP-SERVER, nao basta @reloadscript nem @reloaddb: o
// `reputation_db.load()` so roda no do_init_pc (src/map/pc.cpp), na
// inicializacao. O @reloadscript recarrega ESTE arquivo, mas o Id 5 novo em
// db/guerra/reputation.yml so entra reiniciando - e sem ele o
// set_reputation_points falha com "Unknown reputation type 5".
//
// Comentar esta linha tira a placa E a pontuacao do ar; a arena continua
// funcionando como PvP puro.
npc: npc/guerra/honra_de_combate.txt

// O Corredor Fantasma do bRO: uma sala onde so ha MVP. A porta e um Espectro da
// Morte em comodo 208,187 - a MESMA celula do bRO -, e a sala e o vis_h01, que
// era o mapa do evento la (o "Corridor of Phantoms" la fora). 130 chefes soltos
// - 65 tipos, dois de cada -, renascendo de dois em dois minutos, e cada morte
// tem 30% de largar uma Flor Visionaria (item 25503, que ja existia no vendor
// com o nome em portugues).
//
// A QUANTIDADE E A CHANCE FORAM AJUSTADAS EM 2026-08-08, depois do primeiro
// teste em jogo: eram 65 chefes e DUAS flores garantidas por morte, o que virou
// chuva de flor. Os dois numeros moram no OnInit do arquivo (.FlorQtd e
// .FlorChance); a quantidade de chefes e o terceiro campo de cada linha de spawn.
//
// A ENTRADA E DE GRACA, e isso e diferenca deliberada em relacao ao bRO: la se
// comprava um Selo Visionario que valia 1 hora (gratis, uma vez por dia) ou 4
// horas (10 milhoes de zeny). Aqui nao ha preco, duracao nem recarga.
//
// A TROCA DO bRO NAO ENTROU: la 10 Flores viravam um Premio Visionario, com 1%
// de sair carta de MVP a cada 200 trocas do servidor, e isso foi cortado a
// pedido. O destino da flor foi aberto de outro jeito em 2026-08-08, e por
// fora desta sala - ver flores_da_ordem.txt, logo abaixo.
//
// Os tres andares do bRO viraram UM. O vis_h02..04 existem no GRF e ficaram sem
// nada - abrir um segundo andar e copiar o bloco de spawn trocando o mapa.
//
// A ARMADILHA QUE ESTE ARQUIVO DOCUMENTA, e que vale para toda linha de spawn do
// rAthena: comentario no fim da linha entra DENTRO do nome do evento, porque o
// w4 vai ate o fim da linha e o evento e lido com `%77[^,]`. O chefe nasce e
// morre normalmente, e o evento simplesmente nao dispara. Ver o cabecalho.
//
// Comentar esta linha tira a porta, a saida, os 130 chefes e as regras do mapa -
// o vis_h01 volta a ser um mapa vazio.
npc: npc/guerra/corredor_fantasma.txt

// O DESTINO DA FLOR VISIONARIA, e a segunda fonte de Moeda Nova. QUATRO NPCs em
// Comodo, a poucos passos da porta do Corredor Fantasma e da Maquina de la:
//
//   Alleria  comodo 221,182, sprite 612 (4_F_PINKWOMAN). Compra TODAS as
//            Flores Visionarias da bolsa de uma vez, a 1 Moeda Nova cada.
//            Solta o emote /vem (ET_COMEON, 44) de 4 em 4 segundos, por
//            npctimer - mesmo par do Edgard de prontera 170,199.
//   Saback   comodo 223,182, sprite 468 (4_M_KNIGHT_BLACK). So fala - e a
//            placa que manda o jogador procurar a Alleria.
//   Guardas  comodo 221,184 e 224,184, sprite 966 (4_M_RUSKNIGHT), um
//            atras de cada. So falam. As DUAS FALAS CITAM O SERVIDOR VAZIO -
//            sao metalinguagem, e vao querer ser reescritas no dia em que o
//            servidor encher.
//
// Com isto o circuito fecha: o Corredor da a flor (30% por chefe), a Alleria a
// troca por moeda, e a Maquina de comodo 214,185 gasta a moeda ali mesmo.
//
// NAO E A TROCA DO bRO (10 Flores por um Premio Visionario, com sorteio de
// carta de MVP a cada 200 trocas do servidor) - aquilo foi cortado a pedido, e
// esta e outra coisa: flor vira moeda, uma por uma.
//
// A Alleria e a UNICA fonte de Moeda Nova por esforco; a outra e o Logue e
// Ganhe, que entrega 240 por CONTA por mes independente de jogar. Se a Moeda
// inflacionar, os numeros a mexer sao o `.preco` do OnInit dela e o
// `.FlorChance` do corredor_fantasma.txt. Comentar esta linha tira os dois NPCs
// e devolve a flor a condicao de trofeu sem uso.
npc: npc/guerra/flores_da_ordem.txt

// O CARTAZ VIVO DO CORREDOR FANTASMA. Uma NPC de fala em comodo 207,148,
// sprite 944 (4_M_DST_CHILD, o menino da propria cidade), no canto de aposta da
// cidade - tres celulas da Devellin de 204,148, do par de gambling do rAthena.
// Ela esta NA LINHA DO ESPECTRO: a porta do Corredor fica em 208,187, uma celula
// em x e 39 em y dali, quase reto ao norte. A cena do Corredor inteira fica
// encostada na praia, e quem desembarca em Comodo nao passa por la: esta NPC
// existe so para apontar.
//
// SO FALA - nao vende, nao troca e nao teleporta. A porta continua sendo o
// Espectro da Morte de comodo 208,187 (corredor_fantasma.txt).
//
// E O PRIMEIRO LINK DE NAVEGACAO DO PROJETO: a marcacao "Fica aqui" da segunda
// caixa e clicavel e traca o caminho ate o Espectro no minimapa, por uma
// etiqueta <NAVI> dentro do proprio `mes`. Quem le a etiqueta e o CLIENTE, e ele
// depende de data\luafiles514\lua files\navigation\ - o `comodo` esta na tabela
// do navi_map, e por isso funciona. Mapa fora daquela tabela nao tem rota, e a
// falha e calada; o vis_h01 do Corredor, por exemplo, NAO esta la.
