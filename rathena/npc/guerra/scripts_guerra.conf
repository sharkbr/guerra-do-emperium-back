// pagam em Moeda Nova (30998).
//
// AS DUAS MESAS SAO VICIADAS, E DE PROPOSITO - e o gancho de uma quest futura,
// em que se descobre a falcatrua. No primeiro andar (salao leste: 185,94 /
// 170,94 / 178,92) o baralho e viciado A FAVOR DO JOGADOR em 5%, e ele ganha
// 46,7% das maos contra 44,1%; no segundo (salao oeste: 77,84 / 102,59 /
// 92,47 / 45,59) e viciado a favor da CASA em 10%, e ele ganha 32,3% contra
// 58,9%. A isca e o pagamento: la em cima o 21 natural paga 2:1 em vez de 3:2
// e a aposta e cinco vezes maior, e a mesa de cima drena dezoito vezes mais
// rapido do que a de baixo enche. Os quatro numeros de cada mesa entram como
// argumento do callfunc, uma linha por andar, e foram medidos por
