// Nove lojas de equipamento na rua principal de prontera, tres colunas
// (x=151/155/159) por tres fileiras (y=173/167/161). Uma loja por slot:
// cabeca topo/meio/baixo, armas, armaduras, escudos, capas, sapatos e
// acessorios.
//
// NAO E MAIS "TUDO A 1 ZENY", desde 2026-08-12: item que tem `Buy` no
// item_db entra na loja POR ESSE `Buy`, e so o que nao vale nada
// revendido fica a 1 zeny (CLAUDE.md secao 4, regra 16). A mudanca nao
// foi aplicada para tras - o que entrou antes dela continua a 1 zeny.
//
// Ao carregar, o rAthena imprime um aviso por item dizendo que o preco
// de compra e menor que o de revenda. NAO e erro: e o proprio servidor
// apontando que 1 zeny permite comprar e revender com lucro. So sai para
// os itens antigos - preco de compra nao dispara o aviso. O cabecalho do
// arquivo explica e diz onde e o remedio, se um dia for preciso.
//
// Parte dos itens sao PLACEHOLDER sem bonus nenhum (db/guerra/item_db.yml,
// secao "Mercado Contemporaneo") - equipar nao faz nada ate ajustarem-se
// um a um. Comentar esta linha tira o mercado inteiro do ar.
//
// Cada loja mostra uma PLACA sobre a cabeca com o que vende - "Cabeca topo",
// "Armas", "Acessorios". Por causa dela nenhuma e mais um `shop` puro: sao
// um `script` na coordenada mais um `shop` flutuante "<Nome>#loja" com os
// itens. O cabecalho do arquivo, secao "A PLACA SOBRE A CABECA", explica o
// porque e diz como mudar ou tirar as placas - vale para os tres mercados.
npc: npc/guerra/mercado_contemporaneo.txt

// Quarta fileira do mesmo quarteirao (y=155), QUATRO lojas de TRAJE: tres por
// slot de cabeca - Costumeiro (topo), Adereceiro (meio) e Camareiro (baixo) - e
// o Manteleiro, de CAPA. 435 itens a 1 zeny.
//
// O MANTELEIRO NAO FICA MAIS NAQUELA FILEIRA: em 2026-08-20, por pedido do
// dono, ele foi de 163,155 para 155,131 - duas fileiras abaixo, entre a
// Tranqueiras e o Ze do Caixao. So a coordenada mudou; ele continua sendo
// deste arquivo, e comentar esta linha continua tirando as QUATRO lojas.
//
// Nao e o acervo cosmetico inteiro: sao os itens que este cliente NAO
// CONSEGUIA DESENHAR e que passaram a desenhar em 2026-08-05, trazendo arte,
// entrada de itemInfo e slot de accessoryid da GRF do bRO. Os 1900 cosmeticos
// de cabeca que ja funcionavam antes seguem acessiveis por @item.
//
// O MANTELEIRO E DE 2026-08-08 e nasceu por outro caminho: manto cosmetico
// depende de uma tabela a mais (spriterobeid.lub) e de sprite POR CLASSE de
// personagem, e nao dos 4 arquivos de um chapeu. Os treze itens dele foram
// pedidos um a um; cinco nao desenhavam aqui, e os 2925 arquivos que faltavam
// vieram da GRF do bRO pelo ferramentas/instala_manto.py, escrito para isso.
//
// EM 2026-08-09 ELE DOBROU, para 24, e a rodada achou o teto: ESTE CLIENTE NAO
// DESENHA MANTO COM SLOT ACIMA DE 120. Nao e a tabela - ela foi levada a 158
// entradas contiguas, o cliente a leu, e nada mudou. Nove dos onze novos
// tinham slot entre 122 e 158, e por isso foram apontados para slot MORTO:
// dos 120 que o cliente aceita, 40 nao tem arte nenhuma aqui. O de-para mora
// no `View:` do db/guerra/item_db.yml, e o estende_robeid.py le de la.
// Sobram 31 doadores; depois disso, so patch de exe (PENDENCIAS.md secao 4).
//
// CLIENTE NOVO PERDE AS DUAS COISAS - a tabela e os arquivos -, e repor exige
// os dois scripts NESTA ordem (invertido, o segundo recusa):
//   python ferramentas/estende_robeid.py
//   python ferramentas/instala_manto.py  --ids <lista> --aplicar
// O cabecalho do mercado_de_visuais.txt tem a receita inteira.
//
// ESTE ARQUIVO IMPRIME NOVE AVISOS de `discounted buying price` na subida, um
// por item com Buy no item_db. Sao todos de Buy 10 ou 20, ou seja 4 ou 9 zeny
// de lucro por compra, e estao listados por ID no cabecalho da loja. Aviso com
// item FORA daquela lista e item novo com preco - conferir. Ate 2026-08-09
// eram dois, e o cabecalho dizia que nenhum devia aparecer.
//
// As quatro tambem mostram placa sobre a cabeca ("Visuais: cabeca topo" e as
// irmas, "Visuais: capa" no Manteleiro), pela mesma receita do mercado acima.
//
// A lista com nome de cada item esta em CATALOGO-VISUAIS.md, na raiz; a
// varredura que decidiu a primeira leva e ferramentas/varre_cosmeticos.py -
// mas de 2026-08-05 para ca a maioria das entradas veio de pedido item por
// item, e essas NAO saem de varredura nenhuma: quem regerar a lista pela
// ferramenta as perde. Comentar esta linha tira as QUATRO lojas do ar.
npc: npc/guerra/mercado_de_visuais.txt

// O quarteirao seguinte (y=149/143/137), nove lojas de CARTA a 1 zeny: uma por
// encaixe - arma, escudo, armadura, capacete, capa, sapato e acessorio - mais
// as de MVP e de chefe menor. 1410 cartas.
//
// MVP e chefe sao EXCLUSIVOS: a Carta do Doppelganger saiu da loja de arma e
// esta so na de MVP, para nao aparecer duas vezes. Os dois grupos vem do
// mob_db (quem dropa), nao do item_db - carta nao tem marca de MVP.
//
// GERADO por ferramentas/varre_cartas.py. Atualizar e rodar o script de novo,
// nao editar a mao.
//
// Este ARQUIVO imprime o aviso `npc_parse_shop: Item X discounted buying
// price`, um por carta, e isso e esperado: toda carta do rAthena tem Buy: 20,
// entao revende por 10 e da 9 de lucro. Foi medido nas 5593 antes de escolher
// o preco - 10 zeny e o teto, nenhuma passa disso.
//
// A loja de arma e diferente das outras oito: a lista nao cabe nos 2048 do
// `char w4[2048]` do parser, entao ela carrega 256 cartas na linha do `shop` e
// as outras 103 entram por npcshopadditem no OnInit da propria loja.
//
// As nove tambem mostram placa sobre a cabeca, e a delas leva a CONTAGEM -
// "Cartas de arma (359)" -, porque o nome do NPC ja diz o encaixe. Mesma
// receita do mercado de equipamento; o texto sai do gerador, nao da mao.
//
// A lista completa esta em CATALOGO-CARTAS.md, na raiz. Comentar esta linha
// tira as nove lojas do ar.
npc: npc/guerra/mercado_de_cartas.txt

// O degrau seguinte da mesma grade (prontera 151,131, uma fileira abaixo da
// Carta de Acessorio): UMA loja de MATERIAL BRUTO, 55 itens. Quatro grupos -
// as 17 pecas que as dez Runas do Cavaleiro Runico pedem, tres avulsos
// (Teia de Aranha, Semente de Planta Selvagem, Garrafa Vazia), os 6 do Criar
// Veneno Mortal que faltavam, e os 29 ingredientes da ALQUIMIA, estes pedidos
// em 2026-08-12 pela tabela de Preparar Pocao do browiki.
//
// NAO VENDE RUNA PRONTA, so o que elas custam - vender a runa feita
// esvaziaria o forjar do Cavaleiro Runico. Decisao de 2026-08-12.
//
// TRES COISAS PARA SABER ANTES DE MEXER, as tres no cabecalho do arquivo:
//
// 1) E A UNICA LOJA NOSSA DE PRONTERA QUE NAO COBRA 1 ZENY. Cada item sai
//    pelo `Buy` do item_db, escrito como `-1` na linha do `shop` - quem faz a
//    troca e o npc_parse_shop ao carregar (src/map/npc.cpp:4146), entao a
//    vitrine acompanha o item_db sozinha e nunca diverge dele. Por-la a 1
//    zeny reabre o exploit de revenda em 55 itens de uma vez, e o pior deles
//    seria o OURO (969), com 74.999 de lucro por clique - o maior buraco que
//    o projeto ja teve. Decisao do dono em 2026-08-12, no mesmo dia em que a
//    loja nasceu.
//
// 2) O OURO (969) SO E SEGURO AQUI ENQUANTO O PRECO FOR O DE COMPRA, e as
//    duas decisoes estao amarradas. Ele saiu da lista na manha de 2026-08-12,
//    quando a loja era de 1 zeny e ele revendia por 75.000, e voltou na tarde
//    do mesmo dia junto com a troca de preco: a 150.000 de compra ele passa
//    no teste do npc_parse_shop como qualquer outro. Com ele de volta, as dez
//    receitas de runa fecham inteiras nesta vitrine. (A Boina Alada (5170),
//    que saiu do Chapeleiro no mesmo movimento, NAO voltou - aquela loja
//    continua a 1 zeny.)
//
//    OUTROS DOIS FICARAM DE FORA, por pedido do dono: o ALCOOL (970) e o TUBO
//    DE ENSAIO (1092). Sem o Tubo, o Alcool e as tres Pocoes Compactas nao
//    fecham so com esta vitrine; as outras dezessete receitas de alquimia
//    fecham.
//
// 3) O SPRITE E UMA CLASSE DE JOGADOR (5, `JOB_MERCHANT`), e nenhum NPC do
//    rAthena inteiro faz isso. Funciona por um ramo explicito do
//    status_set_viewdata, mas aquele ramo deixa o penteado em ZERO e este
//    cliente so tem de 1 a 42 - dai as duas linhas de `setunitdata` no
//    OnInit, que nao sao enfeite. Se nascer invisivel ou sem cabeca, a saida
//    ja esta escolhida no cabecalho: trocar por 776 (`4_M_TWMIDMAN`).
//
// Os itens foram validados um a um (CLAUDE.md 4.4), em duas rodadas de
// 2026-08-12: todos existem no item_db do servidor, todos tem nome em
// portugues no itemInfo.lua deste cliente e todos deram arte 4 de 4 no
// valida_visual.py. Comentar esta linha tira a loja do ar.
npc: npc/guerra/tranqueiras.txt

// prontera 159,131, ao lado do Manteleiro e a oito celulas da Tranqueiras -
// e com o MESMO sprite dela, id de classe de jogador (5, `JOB_MERCHANT`),
// porque foi pedido assim. Loja de CAIXAS E CUBOS: oito itens a 1 zeny, cada
// um um `Usable` com bandeira `Container` cujo script e uma linha so,
// `getgroupitem(IG_<GRUPO>)`. Ou seja o que se compra e um SORTEIO - o
// acervo de verdade sao os 245 itens dos oito grupos de
// db/re/item_group_db.yml, contados um a um antes de a loja subir.
//
// Caixa de Espolios (12 elmos de bioarma), Caixa de Armas OS (16), Caixa de
// Bioarmas (39), Caixa do ArchAngeling (7), Caixa de Armadura do Heroi (6),
// Caixa de Armas Ancestrais (38), Cubo Reforcado Primordial (37) e Cubo
// Sombrio de Classe (90).
//
// O PRECO E 1 ZENY ESCRITO NA LINHA, e nao `-1` como na Tranqueiras: nenhuma
// das oito caixas declara `Buy` no item_db, entao `-1` daria tudo de graca.
// Este arquivo entrou na lista de lojas do zera_revenda_das_lojas.py no
// mesmo dia - sem isso, item novo posto aqui reabre o buraco de dinheiro
// infinito calado (CLAUDE.md 4.16).
//
// DUAS DAS OITO SAO PRESAS AO PERSONAGEM pelo item_db do rAthena - a Caixa
// de Armas OS (23772) e a do ArchAngeling (23073) sao NoDrop/NoTrade/NoSell
// e mais um punhado. Comprou, nao sai do inventario. Esta escrito no
// cabecalho do arquivo, com a lista das bandeiras.
//
// UM ITEM DO PEDIDO FICOU DE FORA: a Caixa de Cubos Refinadores (102592),
// que nao existe nem no nosso vendor nem no itemInfo.lua deste cliente, e
// cujo conteudo depende de tres Cubos de Refino que tambem faltam. O
// cabecalho do arquivo tem a conta inteira; a pendencia esta em
// PENDENCIAS.md. Comentar esta linha tira a loja do ar.
npc: npc/guerra/ze_do_caixao.txt

