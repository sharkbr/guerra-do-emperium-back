// --------------------------------------------------------------
// -                 Guerra do Emperium - scripts               -
// --------------------------------------------------------------
//
// Indice dos NPCs escritos por nos. Tudo que e NOSSO mora em
// npc/guerra/ e e listado aqui; nada de conteudo proprio espalhado
// pelas pastas do rAthena.
//
// Por que: o rathena/ foi vendorizado sem o historico do upstream.
// Se a customizacao ficar misturada, um `git diff` nao distingue o
// que e nosso do que veio de terceiros - e trazer correcao do
// rAthena vira arqueologia. Com esta pasta, a fronteira e visivel.
//
// Este arquivo e alcancado por UMA linha `import:` no fim do
// npc/scripts_custom.conf - a unica marca que deixamos em arquivo
// do rAthena na camada de scripts.
//
// Para desligar um NPC sem apagar: comentar a linha com '//'.
// Para aplicar mudanca sem derrubar o servidor: @reloadscript.

npc: npc/guerra/mestre_de_classe.txt

// Concede 50 niveis de base e 50 de classe, com duas confirmacoes.
// prontera 160,187, ao lado do Mestre de Classe. Come a Maca da
// Inocencia de quem tiver uma, mas NAO a exige - e por isso nao tem
// mais limite nenhum de uso. Ver o cabecalho do arquivo.
npc: npc/guerra/mestre_de_up.txt

// Recebe o personagem recem-criado no navio da introducao, entrega a
// Maca da Inocencia e o leva direto para Izlude, pulando a ilha e a
// Academia. Fica em 18,32 das CINCO copias do navio (iz_int e
// iz_int01..04), porque o start_point sorteia uma delas.
npc: npc/guerra/emissario_da_ordem.txt

// O atalho curto: troca a Maca da Inocencia por level 10/10 e uma
// viagem para Prontera. izlude 185,213, a poucos passos de onde o
// Emissario acima desembarca o novato. Ao contrario do Mestre de UP,
// ela EXIGE a Maca - sem ela nao ha troca.
npc: npc/guerra/cavaleira_apressada.txt

// Fecha os portais do navio com disablenpc, de fora, deixando o
// izlude.txt e o academy.txt do rAthena byte a byte iguais ao upstream.
// Com ele ligado o Emissario acima e o UNICO jeito de sair do navio.
// Comentar esta linha devolve o navio original - e reabre a rota que
// pula o Emissario.
npc: npc/guerra/portais_do_navio.txt

// Nove lojas de equipamento na rua principal de prontera, tres colunas
// (x=151/155/159) por tres fileiras (y=173/167/161), tudo a 1 zeny.
// Uma loja por slot: cabeca topo/meio/baixo, armas, armaduras, escudos,
// capas, sapatos e acessorios.
//
// Ao carregar, o rAthena imprime um aviso por item dizendo que o preco
// de compra e menor que o de revenda. NAO e erro: e o proprio servidor
// apontando que 1 zeny permite comprar e revender com lucro. O cabecalho
// do arquivo explica e diz onde e o remedio, se um dia for preciso.
//
// Parte dos itens sao PLACEHOLDER sem bonus nenhum (db/guerra/item_db.yml,
// secao "Mercado Contemporaneo") - equipar nao faz nada ate ajustarem-se
// um a um. Comentar esta linha tira o mercado inteiro do ar.
npc: npc/guerra/mercado_contemporaneo.txt

// Reseta habilidades, atributos ou os dois, de graca e sem limite de uso.
// prontera 144,173, na rua principal a oeste do Chapeleiro do mercado.
// O corpo veio da "Reset Girl" (npc/custom/resetnpc.txt), que ja vinha no
// vendor desligada e continua desligada - este e um NPC nosso, nao aquele.
// O nome foi pedido por memoria do bRO; a NPC nao existe no navi do bRO de
// hoje. Ver o cabecalho do arquivo.
npc: npc/guerra/mesmerita.txt

// Uma sexta Funcionaria Kafra em Prontera, em 152,191 - a praca central, o
// unico ponto da cidade onde nao havia uma (as cinco do rAthena estao nas
// bordas). E COPIA e nao duplicate() por um motivo so: o duplicate traria
// junto o savepoint do portao norte, e a NPC diria "salvei aqui" salvando a
// 140 celulas dali. O resto - armazem, carrinho, teleporte - continua saindo
// por callfunc para npc/kafras/functions_kafras.txt.
npc: npc/guerra/kafra_da_praca.txt

// Move o "Guild Warehouse Manager" de Prontera de 150,191 para 149,191 e o
// renomeia para "Armazem do Cla". Faz isso DE FORA, como o portais_do_navio:
// disablenpc na duplicata do rAthena mais uma duplicata nossa na coordenada
// nova - o npc/re/merchants/guild_warehouse.txt fica byte a byte igual ao
// upstream, e as outras ~30 cidades nao sao tocadas.
// O DIALOGO continua em ingles: traducao passa pelo catalogo, e este arquivo
// ainda nao esta em grupo nenhum. O cabecalho diz como fechar isso.
npc: npc/guerra/armazem_do_cla.txt

// A "Kafra Especial" / "Teletransportadora Especial" que o bRO tinha.
// Este arquivo NAO e nosso: e o warper.txt do proprio rAthena (Euphy,
// v1.5a), que ja vinha no vendor desligado. Ligamos daqui, e nao
// descomentando a linha no npc/scripts_custom.conf, para manter aquele
// arquivo com a nossa unica marca (o `import:` do fim).
//
// Menu: Cidades, Campos, Masmorras, Castelos de Guilda, Masmorras de
// Guilda, Instancias, Areas Especiais - e lembra o ultimo destino.
// Sprite 811 (4_F_KAFRA1), a moca de uniforme da Kafra.
//
// Planta ~50 duplicatas, uma por cidade (ver o fim do warper.txt). Foi
// deixado assim de proposito: primeiro jogar com ele, depois decidir se
// vale podar. Se um dia quisermos versao propria (uma so, ou menu
// restrito a Castelos), o caminho e copiar para npc/guerra/ e comentar
// esta linha - nao editar o arquivo do rAthena.
//
// Atencao: a duplicata de izlude fica em 134,150, hoje sobre a Izlude
// arrasada. O override so trocou o .rsw (modelos), nao o .gat, entao ela
// fica de pe normal - o risco e so ela nascer dentro de um escombro.
npc: npc/custom/warper.txt

// O gato Xanin (172,201) e o Edgard (170,200), que e estilista de ROUPA - troca
// a cor da roupa de graca, sem limite. Os dois num arquivo so porque a fala do
// Xanin cita o Edgard pelo nome.
//
// O teto de cor de roupa e 3, e nao o max_cloth_color: 7 do rAthena: este
// cliente so tem palette 0..3 da 2a classe em diante. Ver o cabecalho.
//
// Vieram junto com uma tenda (168,199) e a Maquina abaixo, como uma cena so. A
// TENDA foi tirada em 2026-08-04, no mesmo dia em que entrou - ela era modelo
// 3D no prontera.rsw do cliente, nunca NPC, e saiu apagando o override em
// cliente\data\. Ver o cabecalho do arquivo.
npc: npc/guerra/xanin_e_edgard.txt

// Uma maquina de venda que nao funciona - so uma fala. prontera 167,199,
// fechando a diagonal com o Edgard e o Xanin, a duas celulas da quina do
// quarteirao. Arquivo proprio porque um NPC por arquivo e o padrao daqui;
// juntar e que precisa de motivo, e ela nao tem o dos dois acima.
npc: npc/guerra/maquina_quebrada.txt

// O "Mestre do Refino" do bRO: refina com os Pergaminhos, sem chance de
// quebrar. prontera 184,177 - a coordenada e o sprite (851) do bRO e do rAthena
// batem, e por isso e a mesma NPC.
//
// SAO DUAS LINHAS E A ORDEM IMPORTA. A primeira liga o ticket_refiner.txt do
// rAthena, que vinha DESLIGADO la (npc/re/scripts_athena.conf:174) - ligamos
// daqui e nao descomentando aquela linha, como no warper.txt. A segunda e a
// nossa, que renomeia a NPC para portugues de fora, com disablenpc mais uma
// duplicata. Se a segunda vier antes, o `duplicate` nao acha o original e a NPC
// nao nasce.
//
// O dialogo esta em portugues: o arquivo entrou no grupo `servico` do catalogo
// e as 82 falas foram traduzidas em npc/guerra/traducao/servico.cat.
npc: npc/re/merchants/ticket_refiner.txt
npc: npc/guerra/mestre_do_refino.txt

// Troca o sprite das 45 duplicatas acima de 811 (Kafra) para 10007
// (portal). Mora fora do warper.txt de proposito - o porque esta no
// cabecalho do arquivo. Comentar esta linha devolve a Kafra.
npc: npc/guerra/sprite_teletransportadora.txt

