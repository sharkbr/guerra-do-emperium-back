//               passaria a render se uma Moeda Nova comprasse mais de dez
//               Moedas do Explorador aqui, que e o que a Maquina cobra do
//               outro lado.
//   2 portais   alberta 116,73 <-> auction_02 43,17.
//
// CONTEUDO EXCLUSIVO DO bRO: o rAthena nao tem nada disto. As missoes moram em
// db/guerra/quest_db.yml, que e alcancado por um `Footer: Imports:` novo no
// db/re/quest_db.yml - aquele arquivo nao tinha rodape nenhum antes.
