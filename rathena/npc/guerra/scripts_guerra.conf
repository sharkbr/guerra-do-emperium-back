// A porta da arena de PvP, em prontera 145,179 - celula VAZIA, tres celulas a
// leste e uma ao sul do Placar da Arena (142,180). Dividiu a fileira y=180 com
// ele de 2026-08-13 a 2026-09-03, quando desceu uma celula a pedido.
// Pergunta uma coisa so e leva para pvp_n_1-5. O `mapflag pvp` do mapa e do
// proprio rAthena; este NPC so transporta. Sprite 10028 (`4_M_DEATH`), a Morte
// encapuzada, virado para leste - o mesmo desde 2026-08-12, quando substituiu
// o 966 (`4_M_RUSKNIGHT`). O 10029 (`4_GHOST_STAND`) esteve no lugar dele por
// algumas horas em 2026-08-13 e foi reprovado na tela, por gosto e nao por
// defeito; o cabecalho do arquivo guarda o porque, para a rodada nao se
// repetir.
//
// O MAPA SE CHAMA "ARENA DE PRONTERA" NA TELA desde 2026-08-13, e o nome nao
// esta no servidor: no kRO o pvp_n_1-5 e a "Sala Bussola", e as duas metades
// do nome que o jogador le (o `mapnametable.txt` do minimapa e o
// `mapInfo_*.lub` do letreiro de entrada) sao geradas NO CLIENTE pelo
// ferramentas/traduz_ptbr.py, da tabela NOSSOS_MAPAS que fica dentro dele.
// Editar os dois arquivos a mao funciona e volta ao nome do bRO na proxima
// rodada da ferramenta, calado.
//
// ELA JA ESTEVE EM DOIS OUTROS LUGARES: 157,187 ate 2026-08-08, 154,187 dali
// ate 2026-08-12. Aquele segundo endereco era a celula do Guia de Prontera, e
// por isso o arquivo carregava um `disablenpc "GuideProntera"`. Com a mudanca
// de 2026-08-12 para uma celula vazia, O DISABLENPC SAIU E O GUIA VOLTOU a
// atender em 154,187 - este arquivo hoje nao altera nada do rAthena. Quem
// desliga o Guia do rAthena, desde o mesmo dia, e o guia_de_prontera.txt, que
// o substitui em portugues.
//
// QUEM MORRE VOLTA PARA PRONTERA 155,183, a celula em que o Warper desembarca.
// Ela NAO segue a porta: eram vizinhas ate 2026-08-12 e a mudanca as afastou,
// de proposito. E script (OnPCDieEvent), nao mapflag: o `nosave` nao alcanca
// morte - o pc_respawn vai direto para o save_point do personagem. Quem nao
// morre continua saindo deslogando; o mapa e `noteleport`.
//
// O arquivo traz junto UMA LINHA DE MAPFLAG em pvp_n_1-5,
// `pvp_nightmaredrop off`: o rAthena entrega as arenas pvp_n_* com 3% de
// chance de o morto largar uma peca no chao, e aqui nao se perde patrimonio.
// Vale so para esta arena, e depende de o scripts_custom.conf ser lido depois
// do scripts_mapflags.conf - o cabecalho do arquivo explica. (O
// `pvp_nocalcrank` que este paragrafo citava foi TIRADO do arquivo: o rank
// interno da arena esta ligado de novo, e o porque tambem esta no cabecalho.)
// E E DAQUI QUE SAI O VISUAL DO FANTASMA DA ARENA. O bot de openkore que
// caca dentro de pvp_n_1-5 aparece como uma CAVEIRA FLAMEJANTE (o Flame
// Skull 1869), e quem liga isso sao dois rotulos deste arquivo -
// OnPCLoginEvent e OnPCDieEvent -, os dois com o mesmo teste:
// `getgroupid() == 20`, o grupo Fantasma de conf/guerra/groups_guerra.yml.
// Jogador nenhum passa por ele.
//
// NAO E @disguise: e o SC_MONSTER_TRANSFORM, o mesmo status do pergaminho
// de transformacao, com duracao infinita. Com @disguise o rAthena passaria
// a anunciar o bot como NPC_TYPE e ninguem conseguiria atacar ele - o
// oposto do ponto de um fantasma. E NAO NASCE NPC NENHUM NA ARENA por causa
// disto: rotulo de evento nao tem lugar no mapa. O porque inteiro esta no
// cabecalho do arena_de_combate.txt, secao "O visual do fantasma".
//
// Comentar esta linha tira a porta do ar, devolve o drop E TIRA A CARA DE
// CAVEIRA DO FANTASMA.
npc: npc/guerra/arena_de_combate.txt

// A Honra de Combate: a reputacao de PvP da arena acima. Matar em pvp_n_1-5
// da um ponto, morrer tira um, e a conta vale PARA A CONTA (o `#` do Variable
// em db/guerra/reputation.yml), nao para o personagem.
//
// Sao TRES pecas que precisam do mesmo Id 5, e mexer numa sem as outras
// quebra calado:
//   db/guerra/reputation.yml         o Id, a variavel e os limites
//   data\contentdata\repute\*.bson   o NOME que o jogador le, no cliente
//                                    (ferramentas/traduz_reputacao.py)
//   este arquivo                     as regras e o placar
//
// O RANKING NAO CABE NO MODAL DE REPUTACAO - o pacote ZC_REPUTE_INFO nao tem
// campo de texto, entao o servidor nao consegue mandar nome de jogador. Por
// isso o arquivo tambem planta uma PLACA (sprite 20269) com o placar. O
// cabecalho do arquivo explica por extenso.
//
// A PLACA JA ANDOU DUAS VEZES: prontera 163,187 ate 2026-08-08, 152,187 dali
// ate 2026-08-13, e hoje 142,180 - cinco celulas a oeste da porta da arena e
// na mesma fileira que ela. A mudanca de 2026-08-08 refez o texto: um TOP 5
// fixo (com linha "vago" quando falta gente), as regras de pontuacao por
// extenso, e um menu de "Ranking completo" (ate 15, so pontuacao positiva) ou
// "Minha pontuacao", que e o caminho antigo para o modal de reputacao.
//
// AS REGRAS DE HOJE, depois do pedido de 2026-08-30, sao DUAS:
//   1) so em pvp_n_1-5;
//   2) matador e morto em nivel 200, os DOIS lados - e este nivel e a unica
//      condicao que existe, valendo para o PONTO e para a CAVEIRA de uma vez.
// Passadas elas: quem mata ganha um ponto e recolhe a caveira, quem morre
// perde um ponto ate o piso de -10.
//
// CAIRAM EM 2026-08-30, a pedido ("vamos derrubar a maioria das regras"), e
// as duas eram de 2026-08-08: a de que o MATADOR so pontuava se o morto
// tivesse ZERO ou mais, e a de que a CAVEIRA so saia se o morto tivesse 1
// ponto ou mais. Nao procurar por elas nos cabecalhos - os dois arquivos
// foram acertados.
//
// O PISO DE -10 TEM DOIS DONOS: o `GREATEST()` do UPDATE deste script e o
// `Minimum: -10` do Id 5 em db/guerra/reputation.yml, que e onde o modal
// trava. Mexer num sem o outro faz a tabela e a tela pararem em numeros
// diferentes, caladas.
//
// O ANTI-CONLUIO SAIU EM 2026-08-13, a pedido: nao ha mais teto por par de
// contas, nem janela de 24 horas, nem espera entre uma morte e a seguinte.
// Toda morte valida vale, quantas vezes acontecer. Isso abre a porta para
// conta descartavel e o dono sabe - o pedido veio com "vamos observar
// primeiro". A tabela `guerra_pvp_confronto` continua no banco, sem ninguem
// escrever nela, e saiu do sql-files/guerra_arena_pvp.sql.
//
// E DESDE 2026-08-08 ELE TAMBEM ENTREGA O TROFEU: a Caveira Humana (30995)
// cai direto no inventario do matador em toda morte valida - ou seja, sempre
// que o ponto tambem sai. Nunca no chao - quem garante isso e o `NoDrop` do
// item em db/guerra/item_db.yml, nao o script. Este e o UNICO lugar do
// servidor que solta a Caveira; comentar esta linha tira a unica fonte dela
// do ar, e a descricao que o jogador le passa a mentir. ATENCAO: a Caveira e
// MOEDA e desde 2026-08-30 NAO HA MAIS FREIO NENHUM sobre ela alem do nivel
// 200 - nem teto por par de contas (saiu em 2026-08-13) nem a exigencia de o
// alvo ter pontuacao (saiu em 2026-08-30). Uma conta descartavel rende uma
// caveira por morte.
//
// EXIGE A TABELA: rodar sql-files/guerra_arena_pvp.sql antes de subir. Sem
// ela o query_sql falha e ninguem pontua - o anuncio de morte continua
// saindo, que e o sintoma que vai aparecer primeiro.
//
// E EXIGE REINICIAR O MAP-SERVER, nao basta @reloadscript nem @reloaddb: o
// `reputation_db.load()` so roda no do_init_pc (src/map/pc.cpp), na
// inicializacao. O @reloadscript recarrega ESTE arquivo, mas o Id 5 novo em
// db/guerra/reputation.yml so entra reiniciando - e sem ele o
// set_reputation_points falha com "Unknown reputation type 5".
//
// Comentar esta linha tira a placa E a pontuacao do ar; a arena continua
// funcionando como PvP puro.
npc: npc/guerra/honra_de_combate.txt

// O Corredor Fantasma do bRO: uma sala onde so ha MVP. A porta e um Espectro da
// Morte em comodo 208,187 - a MESMA celula do bRO -, e a sala e o vis_h01, que
// era o mapa do evento la (o "Corridor of Phantoms" la fora). 130 chefes soltos
// - 65 tipos, dois de cada -, renascendo de dois em dois minutos, e cada morte
// tem 30% de largar uma Flor Visionaria (item 25503, que ja existia no vendor
// com o nome em portugues).
//
// A QUANTIDADE E A CHANCE FORAM AJUSTADAS EM 2026-08-08, depois do primeiro
// teste em jogo: eram 65 chefes e DUAS flores garantidas por morte, o que virou
// chuva de flor. Os dois numeros moram no OnInit do arquivo (.FlorQtd e
// .FlorChance); a quantidade de chefes e o terceiro campo de cada linha de spawn.
//
// A ENTRADA E DE GRACA, e isso e diferenca deliberada em relacao ao bRO: la se
// comprava um Selo Visionario que valia 1 hora (gratis, uma vez por dia) ou 4
// horas (10 milhoes de zeny). Aqui nao ha preco, duracao nem recarga.
//
// A TROCA DO bRO NAO ENTROU: la 10 Flores viravam um Premio Visionario, com 1%
// de sair carta de MVP a cada 200 trocas do servidor, e isso foi cortado a
// pedido. O destino da flor foi aberto de outro jeito em 2026-08-08, e por
// fora desta sala - ver flores_da_ordem.txt, logo abaixo.
//
// Os tres andares do bRO viraram UM. O vis_h02..04 existem no GRF e ficaram sem
// nada - abrir um segundo andar e copiar o bloco de spawn trocando o mapa.
//
// A ARMADILHA QUE ESTE ARQUIVO DOCUMENTA, e que vale para toda linha de spawn do
// rAthena: comentario no fim da linha entra DENTRO do nome do evento, porque o
// w4 vai ate o fim da linha e o evento e lido com `%77[^,]`. O chefe nasce e
// morre normalmente, e o evento simplesmente nao dispara. Ver o cabecalho.
//
// A PORTA GANHOU CARA NOVA EM 2026-08-12: sprite 4_M_DEATH2 (10092) no lugar
// do 4_M_DEATH, virada para o leste, e um OVALO ESCURO aos pes dela - um
// segundo NPC na mesma celula, sem fala e sem rotulo, so desenho. A aura foi
// pedida como 1_SHADOW_VIOLET, e esse sprite NAO EXISTE neste cliente: nao
// esta no npcidentity.lub, nao tem arte no nosso GRF nem no do bRO, e o numero
// (10560) ficaria acima do teto de 10508. O 4_PURPLE_WARP usado no lugar tem
// nome enganoso e desenha PRETO. Ver o cabecalho do arquivo, secao "A aura aos
// pes do Espectro". O Espectro da SAIDA, no vis_h01, continua com o sprite e o
// facing antigos - foi decisao, nao esquecimento.
//
// Comentar esta linha tira a porta, a saida, os 130 chefes e as regras do mapa -
// o vis_h01 volta a ser um mapa vazio.
npc: npc/guerra/corredor_fantasma.txt

// O DESTINO DA FLOR VISIONARIA, e a segunda fonte de Moeda Nova. QUATRO NPCs em
