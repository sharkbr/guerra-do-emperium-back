###########################################################################
# Guerra do Emperium - Lojas de troca (barter)
###########################################################################
#
# Este arquivo e NOSSO. Ele e encadeado a partir do `Footer: Imports:` de
# npc/barters.yml, que so ganhou uma linha apontando para ca.
#
# O QUE E UMA LOJA DE TROCA, e por que ela nao e um `shop` de script:
#
# O barter e o unico tipo de loja do rAthena que abre a janela de TROCA do
# cliente - a mesma da Loja de Pedras de Malangdo, com o icone da moeda e a
# quantidade em cada linha, e o painel "itens que voce quer trocar" ao lado.
# `itemshop` e `pointshop` NAO abrem essa janela: os dois passam pelo
# clif_cashshop_show (src/map/clif.cpp), que e a janela de cash shop, com um
# saldo em numero e sem icone de moeda por linha.
#
# Exige feature.barter (conf/battle/feature.conf) e cliente 2019-01-16 ou
# mais novo - o nosso e 20211103. Quem desenha o icone e a quantidade e o
# proprio pacote: `currencyNameid` e `currencyAmount`, em clif.cpp:23243.
#
# POR QUE BARTER E NAO `itemshop`, e este e o motivo que decide:
#
#   A Moeda Nova (30998) e `NoSell: true`. O itemshop cobra passando cada
#   item da bolsa por `pc_can_sell_item` (npc.cpp:2465), que devolve FALSO
#   para item NoSell quando `allow_bound_sell` nao tem o bit ISR_SELLABLE -
#   e o nosso conf/battle/items.conf traz `allow_bound_sell: 0x0`. Ou seja
#   o itemshop simplesmente NAO ENXERGA a moeda na bolsa: a loja abriria,
#   a compra falharia com "is not enough as payment", e o jogador estaria
#   com as moedas na mao. So funcionaria tirando o NoSell da moeda, que e
#   justamente a trava que a impede de virar mercadoria de mula.
#
#   O barter nao chama `pc_can_sell_item` em lugar nenhum
#   (npc_barter_purchase, npc.cpp:3140). Ele so ignora item equipado, em
#   equip switch e favorito. Moeda NoTrade/NoDrop/NoSell paga normalmente.
#
# A TRAVA QUE MOLDOU A LISTA: o custo do barter e POR UNIDADE
# (`requirement->amount * amount`, npc.cpp:3206), e o YAML nao tem campo de
# quantidade para o item VENDIDO - so `Item`, `Stock`, `Zeny`, `Refine` e
# `RequiredItems`. Nao existe "5 Elunium Perfeito por 1 Moeda" em preco
# unitario: dariam 0,2 Moeda cada.
#
# Por isso todo pacote desta lista e uma CAIXA - um item so, que ao ser
# usado entrega as N unidades. E o padrao do proprio RO (o 13710 ja era
# isso desde o primeiro dia da Maquina), e o que permite a janela nativa
# sem mexer em preco nenhum. Quinze das dezoito caixas ja existiam no bRO
# com nome em portugues e arte completa; so duas foram feitas por nos
# (30997 e 30996, em db/guerra/item_db.yml).
#
# A trava so aperta em pacote. Item que ja se vende UM a um nao precisa de
# caixa nenhuma, e por isso os dois Pergaminhos, o Amuleto de Ziegfried, a
# Goma de Mascar, o Ticket de Expansao de Inventario e a Redea entram
# avulsos: a 1:1 o barter ja expressa.
#
# Mudanca neste arquivo pega com `@reloadbarterdb`.
#
###########################################################################

Header:
  Type: BARTER_DB
  Version: 2

Body:
  # A loja da Maquina. SEM `Map`, de proposito: ela e uma loja FLUTUANTE,
  # que nao existe em mapa nenhum e nao tem sprite. Quem esta no mapa e o
  # NPC de script (npc/guerra/maquina.txt), que dialoga e so entao chama
  # esta loja com `callshop "Maquina#loja",0`.
  #
  # SAO DOIS NPCs chamando esta MESMA loja desde 2026-08-08 - prontera
  # 167,199 e comodo 215,185, o segundo um `duplicate` do primeiro. Abrir
  # uma terceira porta nao mexe neste arquivo: a mercadoria e uma so.
  #
  # Dois motivos para nao ser a Maquina em si:
  #
  #   1) loja de barter nao roda script nenhum, entao ela sozinha perderia
  #      a fala da maquina - o jogador clicaria e cairia direto na janela.
  #   2) o barter tambem nao tem como negar atendimento nem contar moeda
  #      antes de abrir; o script na frente e onde isso cabe.
  #
  # Loja flutuante e alcancavel por nome: mesmo com `m < 0` o rAthena faz
  # `strdb_put(npcname_db, ...)` (npc.cpp:843), e o `callshop` aceita
  # NPCTYPE_BARTER (script.cpp:18222).
  #
  # O `Index` e a ORDEM NA JANELA, e e por isso que ele segue os tres
  # grupos que o menu antigo tinha: passes e cupons, refino, consumiveis.
  # A janela de troca nao tem separador, entao a ordem e a unica coisa que
  # agrupa. Nao renumerar por gosto: o indice tambem e a chave do estoque
  # na tabela `barter` do SQL, se um dia alguma linha ganhar `Stock`.
  #
  # Em 2026-08-12 entrou um QUARTO grupo no fim - "permanentes", o Ticket
  # de Expansao de Inventario e a Redea. Item novo entra no fim do grupo
  # dele, com o Index seguinte; nao se abre buraco no meio.
  #
  # E QUANDO O GRUPO NAO E O ULTIMO, RENUMERA-SE O QUE VEM DEPOIS. Foi o
  # que aconteceu ainda em 2026-08-12, quando o Amuleto de Ziegfried e a
  # Goma de Mascar entraram no fim de "consumiveis": os dois permanentes
  # desceram de 18/19 para 20/21. Isso e seguro HOJE porque nenhuma linha
  # tem `Stock` - se um dia alguma tiver, renumerar passa a mexer no
  # estoque gravado no SQL, e ai o jeito e outro.
  - Name: Maquina#loja
    Items:
      # ----- Passes e cupons -----------------------------------------
      # Caixa, nao passe: usa-la faz `getitem 7776,10`. Dez passes por
      # 100 Moedas, ou seja 10 por passe - a mesma faixa dos cupons ao
      # lado. O passe e gasto no `Ripped Cabus#GymPass`, payon 173,141.
      - Index: 0
        Item: Max_Weight_Up_Box          # 13710 Passe Antigravitacional[1]
        RequiredItems:
          - Index: 0
            Item: Moeda_Nova
            Amount: 100

      # Os cinco cupons sao gastos na UI DE ESTILISTA DO CLIENTE, nao em
      # NPC: quem os consome e `clif_parse_stylist_buy` (src/map/clif.cpp)
      # lendo db/re/stylist.yml. Procurar o ID em npc/ nao devolve nada, e
      # a conclusao facil - e errada - seria que o cupom nao serve para
      # nada aqui. A UI abre pelo `Stylist#prontera`, prt_in 243,168.
      - Index: 1
        Item: New_Style_Coupon           # 7622 Cupom de Corte de Cabelo
        RequiredItems:
          - Index: 0
            Item: Moeda_Nova
            Amount: 10

      - Index: 2
        Item: J_Shop_Coupon              # 6707 Cupom de Penteado
        RequiredItems:
          - Index: 0
            Item: Moeda_Nova
            Amount: 10

      - Index: 3
        Item: J_Shop_Coupon2             # 25736 Cupom de Penteado 2
        RequiredItems:
          - Index: 0
            Item: Moeda_Nova
            Amount: 10

      # DUAS RESSALVAS, as duas do tipo que nao da erro nenhum. O Cupom de
      # Roupa mexe em Body2 (corpo alternativo) e NAO foi verificado se o
      # GRF de 2021 tem os sprites `_body` que ele pede; o de Tintura
      # cobre Clothes_Color 2..7 e este cliente so tem palette 0..3 da 2a
      # classe em diante. Indice sem palette nao da erro: o cliente
      # desenha a cor padrao. Ou seja parte das opcoes come um cupom e nao
      # muda nada na tela. O remedio nao e aqui - e podar db/re/stylist.yml
      # (que teria de virar override nosso) ou tirar o cupom da lista.
      - Index: 4
        Item: Costume_Ticket             # 6959 Cupom de Roupa
        RequiredItems:
          - Index: 0
            Item: Moeda_Nova
            Amount: 10

      - Index: 5
        Item: Clothing_Dye_Coupon        # 6046 Cupom de Tintura
        RequiredItems:
          - Index: 0
            Item: Moeda_Nova
            Amount: 10

      # ----- Refino ---------------------------------------------------
      # Os dois Pergaminhos sao os UNICOS itens avulsos da lista: 1 Moeda
      # por unidade, sem caixa, porque a 1:1 o barter ja expressa. Levam a
      # peca a +6 de uma vez e sem chance de quebrar, no Mestre do Refino
      # (prontera 184,177).
      - Index: 6
        Item: Guarantee_Armor_6Up        # 6235 Pergaminho de Armadura +6
        RequiredItems:
          - Index: 0
            Item: Moeda_Nova
            Amount: 1

      - Index: 7
        Item: Guarantee_Weapon_6Up       # 6231 Pergaminho de Arma +6
        RequiredItems:
          - Index: 0
            Item: Moeda_Nova
            Amount: 1

      # As seis caixas de minerio. O minerio de dentro e lido pela UI de
      # refino do cliente (`feature.refineui: on`) a partir de
      # db/re/refine.yml. A divisao arma/armadura NAO e simetrica como o
      # nome sugere, e vale saber antes de mexer em preco:
      #
      #   armadura: Elunium, Elunium Enriquecido, Elunium Perfeito,
      #             Carnium, Carnium Perfeito
      #   arma:     Oridecon, Oridecon Enriquecido, Oridecon Perfeito,
      #             Bradium, Bradium Perfeito
      #
      # Ou seja o par Carnium/Bradium repete a divisao do par
      # Elunium/Oridecon para a faixa mais alta - Carnium nao e "elunium
      # melhor", e o elunium DE OUTRA FAIXA. "Perfeito" e o HD do rAthena:
      # ao falhar, a peca perde um nivel em vez de quebrar. "Enriquecido"
      # aumenta a chance de acertar, mas quebra.
      #
      # CUIDADO AO TROCAR ID: existem homonimos `LI_` (variantes de evento
      # com o MESMO nome exibido) que NAO aparecem no db/re/refine.yml.
      # Comprar um deles daria um item de nome certo que a UI de refino
      # recusa, sem erro nenhum para denunciar. O criterio e: vale o id
      # que o refine.yml cita.
      - Index: 8
        Item: HD_Elu_Box5                # 16395 -> 5x 6241 Elunium Perfeito
        RequiredItems:
          - Index: 0
            Item: Moeda_Nova
            Amount: 1

      - Index: 9
        Item: HD_Ori_Box5                # 16393 -> 5x 6240 Oridecon Perfeito
        RequiredItems:
          - Index: 0
            Item: Moeda_Nova
            Amount: 1

      - Index: 10
        Item: Enriched_Elunium_Box5      # 13610 -> 5x 7619 Elunium Enriquecido
        RequiredItems:
          - Index: 0
            Item: Moeda_Nova
            Amount: 1

      - Index: 11
        Item: Enriched_Oridecon_Box5     # 13611 -> 5x 7620 Oridecon Enriquecido
        RequiredItems:
          - Index: 0
            Item: Moeda_Nova
            Amount: 1

      # A Bencao do Ferreiro nao e minerio: e o catalisador que a UI de
      # refino exige para passar de +7, e a quantidade cresce rapido (para
      # armadura nivel 1: +8 pede 1, +9 pede 2, e dai 4, 7, 11, 16, 22).
      # Cinco por Moeda parece barato ao lado dos outros ate se somar
      # quanto custa uma peca de +14.
      #
      # A UNICA CAIXA DA LISTA que o bRO nao tinha pronta: la existem so a de 2
      # e a `Blacksmith_Bless_Box_3` (101047, por getgroupitem). A nossa
      # de 5 e o 30997, em db/guerra/item_db.yml.
      - Index: 12
        Item: Cx_Bencao_Do_Ferreiro_5    # 30997 -> 5x 6635 Bencao do Ferreiro
        RequiredItems:
          - Index: 0
            Item: Moeda_Nova
            Amount: 1

      - Index: 13
        Item: F_HD_Carnium_Box5          # 16263 -> 5x 6225 Carnium Perfeito
        RequiredItems:
          - Index: 0
            Item: Moeda_Nova
            Amount: 2

      - Index: 14
        Item: F_HD_Bradium_Box5          # 16262 -> 5x 6226 Bradium Perfeito
        RequiredItems:
          - Index: 0
            Item: Moeda_Nova
            Amount: 2

      # ----- Consumiveis ----------------------------------------------
      # Nao precisam de NPC nenhum: sao itens de usar.
      #
      # A caixa de Guyak e nossa (30996). A do bRO, `Guyak_Pudding_20_Box`
      # (22668), foi REPROVADA por duas razoes somadas: traz 20 e nao 30,
      # e o nome dela no itemInfo.lua do cliente esta em COREANO - o item
      # nao existe no bRO, entao nao ha nome em portugues para ele. Ver a
      # regra do nome em PT no CLAUDE.md, secao 4.
      - Index: 15
        Item: Cx_Pocao_De_Guyak_30       # 30996 -> 30x 12710 Pocao de Guyak
        RequiredItems:
          - Index: 0
            Item: Moeda_Nova
            Amount: 3

      # As duas ultimas sao irmas: mesmo tamanho de pacote (100) e mesmo
      # preco (4), porque as duas caixas ja existiam no bRO nesse tamanho.
      # O AegisName do conteudo nao ajuda a reconhecer nenhum dos dois
      # (`Big_Bun` e `Pill_`); o nome em portugues e a unica referencia
      # confiavel, e foi por ele que os dois foram achados.
      - Index: 16
        Item: Big_Bun_Box100             # 13996 -> 100x 14522 Cogumelo Grelhado
        RequiredItems:
          - Index: 0
            Item: Moeda_Nova
            Amount: 4

      - Index: 17
        Item: Pill__Box100               # 13999 -> 100x 14523 Bala Amarga
        RequiredItems:
          - Index: 0
            Item: Moeda_Nova
            Amount: 4

      # OS DOIS DE 2026-08-12, e sao os primeiros consumiveis avulsos da
      # gaveta - nao vem em caixa, e por isso 5 Moedas compram UM. Os dois
      # sao NoDrop/NoTrade/NoSell no item_db do vendor, como o resto.
      #
      # O AMULETO E `Etc` E MESMO ASSIM SE GASTA, e quem o gasta nao e NPC
      # nenhum: e o C++, no `pc_dead` (src/map/pc.cpp), que procura o
      # ITEMID_TOKEN_OF_SIEGFRIED na bolsa quando o personagem morre e o
      # ressuscita ali mesmo, com HP e SP cheios. Procurar o 7621 em npc/
      # nao devolve nada, e a conclusao facil - e errada - seria que ele
      # nao serve para nada aqui. E a mesma armadilha dos cupons de
      # estilista, do Ticket de Expansao e do CLAUDE.md secao 4.8.
      #
      # Vale reparar no que ele NAO faz num servidor de guerra: o
      # `pc_dead` so chega la depois das saidas de PvP/GvG, entao o
      # Amuleto nao levanta ninguem dentro de castelo.
      - Index: 18
        Item: Token_Of_Siegfried         # 7621 Amuleto de Ziegfried
        RequiredItems:
          - Index: 0
            Item: Moeda_Nova
            Amount: 5

      # A Goma dobra a taxa de DROP por 30 minutos (`sc_start
      # SC_ITEMBOOST,1800000,100`), com 1 minuto de espera entre usos pelo
      # `Reuse_Limit_D`. Cuidado ao mexer no preco: aqui o efeito monta em
      # cima de um servidor que ja e 50x, e meia hora dele por 5 Moedas e
      # a coisa mais barata da lista em valor por minuto.
      - Index: 19
        Item: Bubble_Gum                 # 12210 Goma de Mascar
        RequiredItems:
          - Index: 0
            Item: Moeda_Nova
            Amount: 5

      # ----- Permanentes ----------------------------------------------
      # Os dois de 2026-08-12, e sao de outra natureza que os vinte
      # acima: nao se gastam por uso, se gastam por PERSONAGEM. Por isso
      # ficam no fim e nao dentro de "Consumiveis".
      #
      # O Ticket e consumido pela UI DE EXPANSAO DE INVENTARIO DO
      # CLIENTE, nao por NPC nenhum - procurar o ID em npc/ nao devolve
      # nada, e a conclusao facil seria que ele nao serve para nada aqui
      # (a mesma armadilha dos cupons de estilista, quinze linhas acima).
      # Quem o consome e o `clif_parse_inventory_expansion_request`
      # (clif.cpp:23086), que le uma tabela FIXA NO C++ de tres IDs -
      # 25792 e um deles - e da +10 espacos por ticket.
      #
      # O TETO E DEZ POR PERSONAGEM, e ele e de compilacao: o inventario
      # vai de INVENTORY_BASE_SIZE (100) ate MAX_INVENTORY, que e 100 +
      # INVENTORY_EXPANSION_SIZE (100) = 200 (src/common/mmo.hpp:44). O
      # decimo primeiro ticket recebe MAXIMUM_REACHED e nao e comido -
      # mas ele JA FOI COMPRADO, e as 10 Moedas se perderam. O preco de
      # 10 esta calibrado para isso: 100 Moedas dobram o inventario.
      #
      # Exige cliente 2018-12-19 ou mais novo (o `#if PACKETVER_MAIN_NUM
      # >= 20181219` do mesmo arquivo); o nosso e 20211103.
      - Index: 20
        Item: Inventory_Ex_Dis           # 25792 Ticket de Expansao de Inventario
        RequiredItems:
          - Index: 0
            Item: Moeda_Nova
            Amount: 10

      # A REDEA ETERNA, e "eterna" e o que a distingue das outras quatro
      # do banco. Existem cinco itens de nome parecido e so este nao tem
      # prazo:
      #
      #   12622  Redea                     ESTE - `NoConsume: true`
      #   16682  Caixa de Redea            entrega o 12622, por getgroupitem
      #   16683  Caixa de Redea [30 dias]  entrega o 12622 ALUGADO
      #   17162  Caixa de Redea [7 dias]   idem
      #   17176  Caixa de Redea [3 dias]   idem
      #
      # O `NoConsume` e o que faz a montaria durar para sempre: o item
      # roda o `setmounting()` e NAO some da bolsa. Vender a Caixa (16682)
      # em vez do item daria na mesma e custaria um clique a mais; vender
      # qualquer uma das outras tres entregaria uma montaria que expira,
      # e o jogador so descobriria isso dias depois.
      #
      # 100 Moedas e o preco mais alto da lista, empatado com o Passe
      # Antigravitacional. E de proposito: montaria permanente e a compra
      # que nao se repete.
      #
      # Ele e NoTrade/NoDrop/NoSell/NoCart/NoStorage - fica no personagem
      # que comprou, como o resto desta gaveta.
      - Index: 21
        Item: Boarding_Halter             # 12622 Redea (a permanente)
        RequiredItems:
          - Index: 0
            Item: Moeda_Nova
            Amount: 100

  # =====================================================================
  # A Maquina de Troca da Ordem dos Exploradores
  # =====================================================================
  #
  # Tambem FLUTUANTE, e pelo mesmo motivo da de cima: quem esta no mapa e
  # o NPC de script (npc/guerra/ordem_dos_exploradores.txt, em
  # auction_02 50,39), que conta a moeda do jogador e so entao chama esta
  # loja com `callshop "Ordem#loja"`.
  #
  # NAO E `duplicate` DA MAQUINA ACIMA, e a diferenca e de mercadoria,
  # nao de lugar: aquela vende vinte e dois itens POR Moeda Nova; esta CONVERTE
  # Moeda do Explorador EM Moeda Nova. Duas listas diferentes, duas
  # entradas.
  #
  # UMA LINHA SO, e e o circuito inteiro da Ordem se fechando. A Moeda do
  # Explorador (25737) nao compra mais nada em lugar nenhum - ela vira
  # Moeda Nova aqui, e e a Moeda Nova que tem onde ser gasta. Isso e de
  # proposito: acrescentar item a esta lista abriria uma segunda economia
  # em paralelo a das Maquinas de Prontera e Comodo.
  #
  # POR QUE BARTER E NAO `itemshop`, e aqui o motivo vale EM DOBRO: a
  # regra da secao 4.10 do CLAUDE.md ja bastava (o `itemshop` passa a
  # moeda por `pc_can_sell_item`, que recusa item `NoSell` enquanto
  # `allow_bound_sell` for 0x0), e nesta linha as DUAS moedas sao NoSell -
  # a que se paga e a que se recebe.
  #
  # A TAXA E 10:1, o numero do bRO. Ela e o unico freio entre a caca de
  # instancia e a economia da Moeda Nova, entao mexer neste `Amount` mexe
  # no valor de TODAS as catorze missoes de uma vez. Para calibrar: uma
  # missao media paga 7 moedas, ou seja sete decimos de uma Moeda Nova; as
  # missoes vao de 5 a 25. Baixar para 5 faria a missao media valer 1,4.
  #
  # Mudanca aqui pega com `@reloadbarterdb`, NAO com @reloadscript.
  - Name: Ordem#loja
    Items:
      - Index: 0
        Item: Moeda_Nova                 # 30998, db/guerra/item_db.yml
        RequiredItems:
          - Index: 0
            Item: Dalcom_Coin            # 25737 Moeda do Explorador
            Amount: 10

  # =====================================================================
  # A loja da Opheliac - a Troca de Moedas da Ordem dos Exploradores
  # =====================================================================
  #
  # FLUTUANTE, como as outras duas. Quem esta no mapa e a Opheliac
  # (npc/guerra/ordem_dos_exploradores.txt, auction_02 44,41), que fala e
  # so entao chama esta loja com `callshop "Opheliac#loja"`.
  #
  # A LISTA E A DO bRO, na ordem e nos precos do browiki: dezoito
  # equipamentos de 200 a 2.000 moedas, e dez consumiveis de 1 a 200.
  # Nada foi inventado - cada linha saiu da tabela "Troca de Moedas" da
  # pagina Ordem_dos_Exploradores, e cada ID foi resolvido pelo nome em
  # portugues no `iteminfo_new.lub` do bRO (ferramentas/estado_item.py).
  #
  # OS 32 ITENS FORAM VALIDADOS UM A UM antes de entrar (CLAUDE.md 4.4):
  # existe no servidor, tem entrada no itemInfo.lua do cliente, e a arte
  # esta completa. Nove precisaram de entrada de cliente, posta pelo
  # `completa_iteminfo.py`; o Cartao SSD (490578) precisou tambem da arte,
  # trazida do GRF do bRO pelo `instala_visual.py`. Item sem arte entrega
  # CAIXA DE ERRO ao jogador, e nada no log denuncia.
  #
  # DOIS ITENS NAO EXISTIAM NO NOSSO rAthena e foram criados em
  # db/guerra/item_db.yml, nos IDs oficiais do bRO: os Saltos da Rainha
  # Scaraba (15368) e o Memoravel Anel Rustico (490174). Os bonus proprios
  # dos dois funcionam; os de CONJUNTO ficaram como `# TODO`, pela razao
  # de sempre - conjunto exige a outra peca, e meia implementacao daria
  # bonus fantasma. Ler la antes de vender por 500 e 2.000 moedas.
  #
  # QUATRO ITENS DO bRO FICARAM DE FORA, e nao por descuido:
  #
  #   100283  Combinador Heroico       "Abre a janela de Combinacao"
  #   100284  Combinador do Heroi      idem
  #   100285  Combinador de Tatuagens  idem
  #     Os tres sao pergaminho de ENCANTAMENTO, que era o que o pedido
  #     excluiu. E, mesmo que nao fosse: janela de encantamento e sistema
  #     de UI do cliente, com metade da configuracao do lado de la
  #     (CLAUDE.md 4.9), e nenhuma delas esta montada. Vendidos assim,
  #     nao fariam nada.
  #
  #   103189  Chapeus Sortidos
  #     Caixa de chapeu aleatorio. Nao existe no nosso item_db, e nao e
  #     so criar a entrada: precisa de um grupo em item_group_db com os
  #     sete chapeus dentro, e cada um deles precisa existir e ter arte.
  #     E um trabalho separado.
  #
  # A TRANSFORMACAO DE VISUAIS e o ENCANTAMENTO DO ROBOZINHO, que a
  # Opheliac tambem faz no bRO, ficaram de fora por decisao de
  # 2026-08-08. Ela so vende.
  #
  # SOBRE OS PRECOS: sao os do bRO e sao ALTOS perto do que a Ordem paga.
  # Uma missao media da 7 moedas e as tres placas juntas dao ~100 por dia,
