###########################################################################
# Guerra do Emperium - Conjuntos proprios
###########################################################################
#
# Este arquivo e NOSSO. Ele e encadeado a partir do `Footer: Imports:` de
# db/item_combos.yml, que so ganhou uma linha apontando para ca.
#
# Por que aqui e nao em db/import/item_combos.yml: o .gitignore do proprio
# rAthena ignora /db/import (rathena/.gitignore, linha 67). Um conjunto
# definido la ficaria fora do git e sumiria num clone limpo. Mesma razao,
# e mesma solucao, do db/guerra/item_db.yml.
#
###########################################################################
# NASCEU EM 2026-08-05, COM A DIADEMA DO PARAISO COM COVA
###########################################################################
#
# A loja do Ocleiro (npc/guerra/mercado_contemporaneo.txt) trocou o 19024
# pelo 19455, que e a mesma Diadema do Paraiso com um encaixe. O 19455 nao
# existe no nosso rAthena vendorizado e entrou em db/guerra/item_db.yml.
#
# So que TROCAR O ID QUEBRA CONJUNTO. Conjunto no rAthena e casado por
# AegisName, nao por familia - a versao com cova e outro item, e ponto.
#
# O rAthena sabe disso e tem receita para isso: onde ele conhece as duas
# versoes, ele lista a com cova como ALTERNATIVA dentro do mesmo
# `- Combos:`, duas listas `- Combo:` compartilhando um Script so. E o
# caso dos outros tres itens que a loja trocou no mesmo dia - 19444,
# 19446 e 410125 estao la, ao lado das versoes sem cova, e por isso nao
# precisaram de nada.
#
# Com a Diadema nao dava, porque o 19455 nao existe no vendor: nao ha
# alternativa a listar. O db/re/item_combos.yml cita `Protect_Feathers`
# (19024) em tres conjuntos:
#
#   1) Boina Alada (5170) + Diadema        -> loja do Chapeleiro
#   2) Diadema + Traje Protetor (19381)    -> loja do Retoqueiro
#   3) Diadema + Traje + Escudo Protetor (28985)
#
# Duas das tres pecas estao a venda no mesmo mercado, a poucos passos do
# Ocleiro. Sem este arquivo, quem comprasse a versao com cova - que custa
# mais e existe justamente para ser melhor - PERDERIA bonus em relacao a
# sem cova, e sem nenhum aviso: conjunto que nao fecha nao da erro, so nao
# acontece. O 28985 nao esta no mercado, mas foi espelhado igual: o motivo
# de espelhar e o ID ter mudado, e isso vale para o item onde quer que ele
# venha a cair.
#
# Cada Script abaixo e copia do conjunto correspondente do
# db/re/item_combos.yml, sem uma virgula de diferenca - a unica mudanca e
# `Protect_Feathers` virar `Protect_Feathers_`. Se um dia o rAthena mudar
# os numeros dele, ESTES AQUI NAO MUDAM SOZINHOS.
#
# Sao entradas separadas, e nao a alternativa dentro do `- Combos:` deles,
# porque de um arquivo de import nao se acrescenta linha a uma entrada
# alheia. O efeito para o jogador e o mesmo: so um equipamento de meio
# cabe por vez, entao ou fecha o conjunto da versao sem cova ou o da com
# cova, nunca os dois.
#
# **Ao atualizar o rathena/, conferir os tres contra o db/re/**, junto com
# as secoes de placeholder e de override do db/guerra/item_db.yml. E se o
# vendor um dia trouxer o 19455 de verdade, ele provavelmente trara estes
# conjuntos junto - e ai os daqui viram duplicata e devem sair.
#
###########################################################################

Header:
  Type: COMBO_DB
  Version: 1

Body:
  # ----- Boina Alada + Diadema do Paraiso [1] --------------------------
  # Espelha db/re/item_combos.yml, o conjunto 5170 + 19024.
  # O refino lido e o do EQUIPAMENTO DE TOPO (a Boina), nao o da Diadema.
  - Combos:
      - Combo:
          - Feather_Beret    # 5170
          - Protect_Feathers_    # 19455
    Script: |
      .@r = getequiprefinerycnt(EQI_HEAD_TOP);
      if (.@r >= 7) {
         bonus bAspdRate,5;
         if (.@r >= 9) {
            bonus bMaxHPrate,5;
         }
      }

  # ----- Diadema do Paraiso [1] + Traje Protetor -----------------------
  # Espelha db/re/item_combos.yml, o conjunto 19024 + 19381.
  - Combos:
      - Combo:
          - Protect_Feathers_    # 19455
          - Protect_cloth    # 19381
    Script: |
      bonus bMdef,5;
      bonus bDef,50;
      bonus bAspdRate,5;
      bonus bVit,5;
      bonus2 bSubRace,RC_Player_Human,3;
      if (readparam(bVit) >= 108) {
         bonus bMdef,5;
         bonus bDef,50;
         bonus bAspdRate,5;
         bonus bVit,5;
      }
      if (readparam(bVit) >= 120) {
         bonus bMdef,10;
         bonus bDef,100;
         bonus bVit,10;
      }

  # ----- Diadema [1] + Traje Protetor + Escudo Protetor ----------------
  # Espelha db/re/item_combos.yml, o conjunto 19024 + 19381 + 28985.
  - Combos:
      - Combo:
          - Protect_Feathers_    # 19455
          - Protect_cloth    # 19381
          - Protect_Shield_TH    # 28985
    Script: |
      bonus2 bSubSkill,"WL_CRIMSONROCK",30;
      bonus2 bSubSkill,"NC_ARMSCANNON",30;
      bonus2 bSubSkill,"RA_ARROWSTORM",30;
      bonus2 bSubSkill,"SR_HELLGATE",30;
      bonus2 bSubSkill,"SU_LUNATICCARROTBEAT",30;
      bonus2 bSubSkill,"SU_CN_METEOR",30;
