# Logue e Ganhe - a fonte diaria de Moeda Nova.
#
# GERADO por ferramentas/monta_logue_e_ganhe.py. Nao editar a mao:
# a mesma tabela de premios tambem sai no CheckAttendance.lub do
# cliente, e as duas metades precisam bater byte a byte no premio.
#
# VINTE DIAS E O TETO, e o teto e do CLIENTE, nao nosso. Tres provas:
# o CheckAttendance.lub do kRO 2021-11-03 tem 20 entradas; o do
# ROenglishRE tambem; e o proprio rAthena so abre a janela no login
# quando `pc_attendance_counter(sd) < 200` (src/map/pc.cpp), que e
# `contador < 20`. Pedir um dia 21 aqui nao daria erro - o quadrado
# simplesmente nao existe na janela.
#
# UM CICLO POR MES CIVIL. O contador (`#AttendanceCounter`) so zera
# quando comeca um periodo NOVO, entao periodo unico e longo daria
# 20 dias por conta na vida inteira. Mes a mes, a conta que loga
# todo dia fecha os 20 e recomeca no dia 1 do mes seguinte.
#
# O contador e de CONTA (`#` = variavel de conta), nao de
# personagem - trocar de personagem nao rende de novo.
#
# ESPERADO no boot: o map-server avisa
#   Node "End" date <n> has already passed, skipping.
# uma vez por mes ja vencido. Nao e defeito - e o rAthena pulando
# ciclo velho. Quando o ULTIMO ciclo daqui vencer, o sistema morre
# calado: sem janela, sem erro. Rodar a ferramenta de novo com
# ULTIMO adiantado antes disso.

