        CostsDoram:
            RequiredItem: Clothing_Dye_Coupon
            RequiredItemBox: CCloth_Dye_Coupon_Box
      - Index: 11
        Value: 11
        CostsHuman:
            RequiredItem: Clothing_Dye_Coupon
            RequiredItemBox: CCloth_Dye_Coupon_Box
        CostsDoram:
