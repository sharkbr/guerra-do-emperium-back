###########################################################################
# Guerra do Emperium - EVENTO DE REFINO
#
# Este arquivo e VERSIONADO e vale para qualquer clone do repo. Ele e
# importado por db/refine.yml, depois de db/guerra/refine.yml e antes de
# db/import/refine.yml.
#
# ------------------------------------------------------------- o que ele e
#
# As chances "dentro do Evento" do Evento de Refino, pedidas pelo dono em
# 2026-08-17 a partir das tabelas do browiki
# (arquivo.browiki.org/wiki/Refinamento#Evento_de_Refino, servidor
# Valhalla), enviadas em dois screenshots.
#
# ARQUIVO GERADO. Editar a mao funciona, mas a proxima geracao apaga - a
# tabela de origem esta no cabecalho abaixo, em porcentagem.
#
# ---------------------------------------------------------- COMO DESLIGAR
#
# Comentar a linha `- Path: db/guerra/refine_evento.yml` no rodape de
# db/refine.yml e REINICIAR o map-server. Nao ha `@reloadrefinedb`: o
# refine_db so e lido no boot.
#
# Enquanto a linha estiver la, o evento esta LIGADO o tempo todo. Nao ha
# horario nem interruptor em jogo - o rAthena nao tem conceito de "evento"
# no refino, a tabela e uma so e vale para sempre.
#
# ------------------------------------------------ o que muda, e o que nao
#
# O db/re/refine.yml do rAthena e, tirando um ponto percentual aqui e ali
# no +10, EXATAMENTE a tabela "fora do Evento" do browiki - conferido
# coluna a coluna em 2026-08-17. Por isso este arquivo so precisa escrever
# a DIFERENCA entre as duas tabelas:
#
#   MINERIO COMUM  (Type: Normal)    - so +11 a +20 mudam. De +1 a +10 as
#                                      duas tabelas do browiki sao iguais.
#   MINERIO ESPECIAL ate +10         - o Refinado (Type: Enriched), +5 a
#                                      +10.
#   MINERIO ESPECIAL acima de +10    - o HD (Type: HD), +11 a +20. Acima
#                                      do +10 nao existe minerio Refinado,
#                                      entao a coluna "especiais" do
#                                      browiki so pode ser o HD - e o
#                                      proprio rAthena ja o trata assim no
#                                      tier Etel, onde o HD tem taxa
#                                      melhor que o comum.
#
# O QUE FICOU DE FORA, e de proposito: o HD ate +10. No rAthena ele repete
# a taxa do minerio comum, e o browiki nao tem coluna que separe os dois
# ali. Mudar isso deixaria o HD identico ao Refinado em taxa e melhor em
# penalidade (o HD nao quebra, so cai um nivel), o que apagaria o Refinado
# do jogo. Se um dia a decisao mudar, e uma linha no gerador.
#
# NADA ALEM DA TAXA E TOCADO. O leitor de YAML do rAthena mescla campo a
# campo dentro de cada `Chances` (RefineDatabase::parseBodyNode,
# src/map/status.cpp): omitir `Price`, `Material`, `BreakingRate` e
# `DowngradeAmount` preserva os do arquivo original, inteiros. Preco,
# minerio, chance de quebrar e quantos niveis se perde continuam os
# mesmos - o evento so mexe em acertar.
#
# ------------------------------------------------------ o teto de refino
#
# `refino_teto: 16` em conf/guerra/battle_guerra.txt: a janela de refino
# nao passa do +16. As linhas de +17 a +20 abaixo estao escritas por
# inteireza da tabela, e hoje nao sao alcancaveis por jogador.
#
# ------------------------------------------ o Aben (Bencao do Ferreiro)
#
# O `BlacksmithBlessingAmount` NAO esta aqui - ele mora em
# db/guerra/refine.yml, que existe para aquele assunto so. O evento nao
# muda quantas bencaos cada nivel pede.
#
# --------------------------------------------------- COMO RECARREGAR
#
# Nao tem comando @. REINICIAR O MAP-SERVER; login e char podem ficar de
# pe.
###########################################################################
