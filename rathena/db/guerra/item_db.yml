  # Humana trazem, e por-la seria inventar (regra 4.3). CONSEQUENCIA
  # PRATICA: com a mochila cheia o `getitem` da Roleta largaria o premio
  # NO CHAO (CLAUDE.md secao 5) - quem impede isso e o `checkweight` que a
  # Roleta faz antes de cobrar, e SO ELE. Pondo `NoDrop` aqui um dia,
  # troca-se a fonte por gosto; e decisao legitima, mas e decisao.
  #
  # A ARTE VEIO DO GRF DO bRO nesta mesma rodada - os quatro recursos de
  # `zilant_tarot_deck` (.spr, .act, icone e icone grande) faltavam
  # INTEIROS neste cliente. Cliente novo perde os quatro, calado, e a
  # caixa de erro aparece ao ABRIR a lista, nao ao usar. Repor com:
  #     python ferramentas/instala_visual.py --id 600 --grf "<grf do bRO>"
  #
  # A REGRA DA HABILIDADE CONJURADA NAO ESTA AQUI. Sao tres tabelas e um
  # teste de primalidade, e moram em npc/guerra/album_de_cartas_de_taro.txt
  # - o cabecalho de la traz a tabela inteira do browiki, o de-para de cada
