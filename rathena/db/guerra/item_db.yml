###########################################################################
# Guerra do Emperium - Itens proprios
###########################################################################
#
# Este arquivo e NOSSO. Ele e encadeado a partir do `Footer: Imports:` de
# db/re/item_db.yml, que so ganhou uma linha apontando para ca.
#
# Por que aqui e nao em db/import/item_db.yml: o .gitignore do proprio
# rAthena ignora /db/import (rathena/.gitignore, linha 67). Um item
# definido la ficaria fora do git e sumiria num clone limpo.
#
# Faixa de IDs reservada para nos: 30000-30999 (medida livre em
# 2026-07-31, tanto no item_db do servidor quanto no itemInfo.lua do
# cliente). Vamos preenchendo de tras para frente.
#
###########################################################################

Header:
  Type: ITEM_DB
  Version: 3

Body:
  - Id: 30999
    AegisName: Maca_Da_Inocencia
    Name: Maçã da Inocência
    # Etc, e nao Usable, de proposito: a Maca nao e usada pelo jogador.
    # Quem a consome e o Mestre de UP (npc/guerra/mestre_de_up.txt).
    # Como Usable, o cliente ofereceria um botao de usar que nao faria
    # nada.
    Type: Etc
    Weight: 10
    # A Maca nao sai do personagem que a recebeu: sem chao, sem armazem,
    # sem troca, sem RoDEX, sem leilao. Ela so tem um destino, que e o
    # Mestre de UP.
    # Cuidado ao mexer: `Override` (padrao 100) e o group_id que ignora
    # tudo isto. A conta de teste e group 99, entao ela SENTE as travas -
    # se um dia um GM de 100+ testar, nao vai sentir.
    Trade:
      NoDrop: true
      NoTrade: true
      NoStorage: true
      NoGuildStorage: true
      NoMail: true
      NoAuction: true
      NoCart: true
    # Sem AliasName: o cliente agora conhece o 30999 de verdade. A entrada
    # [30999] do itemInfo.lua e posta pelo ferramentas/instala_item.py -
    # rodar de novo depois de trocar o cliente ou de mexer no texto.
    # O item nao tem arte propria: o `resourceName` da entrada e copiado
    # byte a byte do da Maca comum, entao o desenho e o mesmo sem custar
    # arquivo nenhum. Ate aqui o nome e a descricao ja sao os nossos.

  - Id: 30998
    AegisName: Moeda_Nova
    # Nome sem acento nenhum, e por sorte: `Moeda Nova` e ASCII puro. O
    # que o jogador le vem do itemInfo.lua do cliente, nao daqui - este
    # `Name` so aparece em log, @iteminfo e mensagem de GM.
    Name: Moeda Nova
    # A MOEDA DO REINO. E a moeda-corrente da Ordem, feita para ser o
    # preco dos servicos novos. Desde 2026-08-07 o circuito FECHA:
    #
    #   ONDE GASTAR  a Maquina (npc/guerra/maquina.txt) cobra a moeda em
    #                dezessete itens. Sao DUAS desde 2026-08-08 - prontera
    #                167,199 e comodo 215,185, a segunda um `duplicate`.
    #   DE ONDE VEM  1) o Logue e Ganhe (db/guerra/attendance.yml) entrega
    #                   10 por dia e 50 no vigesimo - 240 por CONTA por mes,
    #                   independente de jogar.
    #                2) a Alleria (npc/guerra/flores_da_ordem.txt, comodo
    #                   221,182) paga 1 por Flor Visionaria, desde
    #                   2026-08-08. E a fonte por ESFORCO, e nao tem teto:
    #                   a flor cai em 30% das mortes de chefe do Corredor
    #                   Fantasma.
    #
    # As outras duas fontes pensadas continuam POR FAZER, mas desde
    # 2026-08-08 as duas ja tem desenho, e nenhuma delas e fonte nova de
    # riqueza - as duas so CONVERTEM item que ja custou trabalho:
    #                3) a Moeda do Explorador (25737) a 10 por 1, na Maquina
    #                   de Troca da Ordem dos Exploradores (alberta 115,72).
    #                   Ver PENDENCIAS.md secao 1g.
    #                4) a Caveira Humana (30995), que espera o NPC que a
    #                   compra. Ver PENDENCIAS.md secao 4b.
    #
    # O premio do Logue e Ganhe chega por RoDEX, e o `NoMail` abaixo NAO
    # atrapalha: o itemdb_canmail so e checado quando um JOGADOR anexa
    # item (src/map/mail.cpp), e o correio do sistema e gerado direto.
    #
    # Etc, como toda moeda do rAthena (Moeda Manuk 6080, Moeda
    # Esplendor 6081): moeda nao se "usa", se gasta em NPC.
    Type: Etc
    # Peso 0, igual as moedas do rAthena. Moeda que pesa vira imposto
    # sobre quem acumula, e a fonte diaria (Logue e Ganhe) faz acumular.
    Weight: 0
    # Buy/Sell omitidos = 0 dos dois lados. `NoSell` e o que torna a
    # ultima linha da descricao literal: em NPC comum a moeda nem entra
    # na janela de venda, em vez de entrar valendo 0 zeny.
    #
    # O resto do bloco e o mesmo perfil da Moeda Manuk (6080), que e a
    # moeda-modelo do rAthena, com UMA diferenca: nao ha `NoStorage`, de
    # proposito. O jogador guarda a moeda no armazem dele, mas ela nao
    # sai do jogador - sem chao, sem troca, sem carrinho, sem armazem de
    # cla, sem RoDEX e sem leilao. Isso e o que segura a moeda de virar
    # mercadoria de mula: a renda e por cidadao (10/dia), entao trocavel
    # ela viraria renda por CONTA CRIADA.
    #
    # Se um dia a decisao for abrir economia de jogador em cima dela,
    # o passo e tirar `NoTrade` e `NoDrop` daqui - nao ha nada em
    # script dependendo da trava.
    #
    # Cuidado ao testar: a conta de teste e group 99 e SENTE estas
    # travas; um GM de group 100+ nao sente (`Override`, padrao 100).
    Trade:
      NoDrop: true
      NoTrade: true
      NoSell: true
      NoCart: true
      NoGuildStorage: true
      NoMail: true
      NoAuction: true
    # Sem arte propria: a entrada [30998] do itemInfo.lua copia o
    # `resourceName` da Moeda Manuk (6080) byte a byte, entao o desenho
    # e o da moeda dela. Quem poe a entrada e o
    # ferramentas/instala_item.py - rodar de novo depois de trocar o
    # cliente ou de mexer no texto da descricao.


  # ----- As duas caixas da Maquina - 2026-08-07 -------------------------
  #
  # Item nosso de ID nosso, como a Maca e a Moeda acima. Mas a razao de
  # existirem e diferente das duas, e vale registrar: elas nao sao itens
  # novos de jogo, sao EMBALAGEM.
  #
  # A loja de troca da Maquina (npc/guerra/barters_guerra.yml) cobra POR
  # UNIDADE - o rAthena nao tem campo de quantidade para o item vendido
  # numa loja de barter. "5 Bencoes por 1 Moeda" so existe se as 5
  # Bencoes forem UM item. Dezesseis das dezoito linhas daquela loja usam
  # caixa que o bRO ja tinha pronta; estas duas sao as que faltavam.
  #
  # Se um dia a Maquina deixar de ser loja de troca, estas duas perdem a
  # razao de ser junto com ela.
  #
  # As duas copiam arte de uma caixa existente (`arte_de` no
  # ferramentas/instala_item.py), entao nao ha arquivo de arte novo.

  - Id: 30997
    AegisName: Cx_Bencao_Do_Ferreiro_5
    Name: "Cx. Bênção do Ferreiro (5)"
    # A unica caixa da Maquina que o bRO nao tinha em tamanho nenhum que
    # servisse: la existem a de 2 e a `Blacksmith_Bless_Box_3` (101047),
    # e essa ultima entrega por `getgroupitem`, nao por `getitem`.
    # Copiamos a ARTE dela e nao o mecanismo - grupo de item traria a
    # incerteza de sorteio, que aqui nao faz sentido nenhum.
    Type: Usable
    # Peso 0 como a caixa de 3 do bRO. Caixa que se abre no ato nao
    # deveria cobrar pedagio de peso.
    Weight: 0
    # Mesmo perfil de travas das caixas irmas do bRO (13610, 16262...) e
    # da propria Moeda que a compra. Sem `NoStorage`, tambem como elas: o
    # jogador guarda no armazem dele, mas a caixa nao passa para outro.
    Trade:
      NoDrop: true
      NoTrade: true
      NoSell: true
      NoCart: true
      NoGuildStorage: true
      NoMail: true
      NoAuction: true
    # `getitem` direto, e nao `getgroupitem`: o conteudo e fixo.
    # Cuidado ao mexer - o 6635 e a Bencao do Ferreiro de verdade, e a
    # quantidade aqui e a unica coisa que sustenta o preco de 1 Moeda
    # na loja de troca. Mudar uma exige mudar a outra.
    Script: |
      getitem 6635,5;

  - Id: 30996
    AegisName: Cx_Pocao_De_Guyak_30
    Name: "Cx. Poção de Guyak (30)"
    # O bRO TEM uma caixa de Guyak - a `Guyak_Pudding_20_Box` (22668) -
