# o nosso rAthena vendorizado ainda nao conhece. Cada um esta no seu ID
# oficial, o mesmo que o bRO usa.
#
# Como isso foi descoberto: o mercado (npc/guerra/mercado_contemporaneo.txt)
# foi montado a partir de uma lista de nomes em portugues. A tabela
# id -> nome do bRO foi lida do `iteminfo_new.lub` da instalacao do
# Ragnarok Brazil desta maquina (18845 itens) - ver ferramentas/LEIAME.md,
# secao do `completa_iteminfo.py`. Cruzando essa tabela com o nosso
# item_db_equip.yml, 18 itens da lista simplesmente nao existiam aqui.
#
# PREENCHIDAS EM 2026-08-01. Quando esta secao nasceu, de manha, as 18
# entradas eram casca vazia - `# TODO bonus` em todas, e equipar nao fazia
# nada. A decisao de nao inventar efeito continua valendo; o que mudou e
# que **nao foi preciso inventar**: a descricao completa de cada item, com
# os numeros e cada bonus por extenso, estava no `iteminfo_new.lub` do bRO.
#
# De onde veio cada coisa:
#
#  | numero              | fonte                                          |
#  |---------------------|------------------------------------------------|
#  | ATQ, DEF, peso...   | as linhas "Tipo:/ATQ:/Peso:" da descricao      |
#  | os bonus            | as linhas de efeito da mesma descricao         |
#  | Range, Jobs, slot   | um item vizinho do mesmo SubType no rAthena    |
#  | forma do Script     | o Blut_Axe (1328), que o vendor JA tinha       |
#
# O ultimo item e o que deu confianca ao resto: **duas das quinze armas
# Brutais ja existiam no rAthena** (Blut_Axe 1328 e Blut_Spear 32014), com
# o script escrito por eles. As treze que faltavam seguem o mesmo molde,
# com os numeros que a descricao do bRO manda. Nao e traducao livre: e
# preencher a lacuna de uma familia que ja estava meio implementada.
#
# ONDE AINDA HA `# TODO`: efeito que o rAthena nao expressa com `bonus`,
# e bonus de CONJUNTO. Conjunto exige a outra peca do set, que em geral
# nem esta no servidor - implementar so a metade daria bonus fantasma.
# Cada TODO cita a linha em portugues que ficou de fora, para nao ser
# preciso reabrir a descricao para saber o que falta.
#
# O `AegisName` e o `Name` em ingles sao NOSSOS e provisorios. A linha
# "Brutal" do bRO e a familia `Blut_` do rAthena (Blut_Axe 1328 e
# Blut_Spear 32014 ja existiam no vendor), entao os treze que faltavam
# seguem o mesmo prefixo. Se um dia o rAthena trouxer estes itens de
# verdade, o `Footer: Imports:` faz o NOSSO arquivo ser lido DEPOIS do
# db/re/item_db.yml - entao estas entradas venceriam a versao boa, calado.
# **Ao atualizar o rathena/, conferir esta secao antes de qualquer coisa.**
