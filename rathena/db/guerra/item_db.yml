  - Id: 20925
    # Capa do Comandante. A tela prometia mais do que o servidor entregava, e
    # a divergencia era dupla: o `itemInfo.lua` do cliente diz "Resistencia as
    # racas Humano e Doram +5%", e o db/re/item_db_equip.yml dava
    # `bonus2 bSubRace,RC_Player_Human,3` - tres em vez de cinco, e nada para
    # Doram. O resto da descricao bate com o script linha por linha (HP e SP
    # +3%, ATQ e ATQM +10, degraus em +5 e +7); so a resistencia mentia.
    #
    # Achado em 2026-08-09, ao refazer no item_db uma soma de resistencia que
    # tinha sido feita lendo a tela - o caso que virou armadilha no CLAUDE.md
    # secao 5 ("a descricao do item na tela discorda do script do servidor").
    #
    # Corrigido pelo SERVIDOR, por decisao do dono em 2026-08-10, e pelo mesmo
    # raciocinio do override do 400287 la em cima: entre trocar a descricao do
    # cliente e trocar o efeito do servidor, trocar o servidor e o lado barato
    # e o lado certo. Mexer no cliente exigiria instala_item.py mais fechar e
    # reabrir o cliente, e deixaria a nossa descricao divergente do bRO.
    #
    # `Script:` E UM CAMPO SO. A mesclagem por campo (ver a nota grande no
    # topo desta secao) nao alcanca linha de script: sobrescrever a linha da
    # resistencia obriga a repetir o script INTEIRO, com os degraus de refino
    # e tudo. O bloco abaixo foi COPIADO do db/re/item_db_equip.yml e teve uma
    # linha trocada e uma acrescentada - nada mais. Quem mexer aqui de novo
    # copia de la outra vez, em vez de reescrever de cabeca.
    #
    # `bonus bMdef,10` FICA, e nao e divergencia: ele aparece na tela, no
    # rodape de status da propria descricao ("DEF: 20 DEFM: 10"). Nao ha linha
    # azul de efeito para ele porque MDEF de armadura nunca tem - e o mesmo
    # padrao dos outros itens do arquivo.
    #
    # Os TRES CONJUNTOS desta capa com as botas do Heroi (22035, 22036,
    # 22037) tinham a mesma divergencia pela metade - `RC_Player_Human,5` e
    # nada para Doram, contra uma descricao que promete os dois - e foram
    # corrigidos no mesmo dia, em db/guerra/item_combos.yml. Nao cabiam
    # aqui: conjunto e outro banco, e a sobrescrita la e por lista de itens,
    # nao por Id de item.
    AegisName: Commander_manteau_J
    Name: "Capa do Comandante"
    Script: |
      .@r = getrefine();
      bonus bMaxHPrate,3;
      bonus bMaxSPrate,3;
      bonus bMdef,10;
      bonus bBaseAtk,10;
      bonus bMatk,10;
      bonus2 bSubRace,RC_Player_Human,5;
      bonus2 bSubRace,RC_Player_Doram,5;
      if (.@r>=5) {
         bonus bBaseAtk,20;
         bonus bMatk,20;
         bonus bMaxHPrate,7;
         bonus bMaxSPrate,7;
      }
      if (.@r>=7) {
         bonus bBaseAtk,30;
         bonus bMatk,30;
         bonus bMaxHPrate,10;
         bonus bMaxSPrate,10;
      }

