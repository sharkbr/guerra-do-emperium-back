  # porque o AegisName oficial nao esta em tabela nenhuma que alcancamos -
  # o itemInfo.lua guarda nome, descricao e recurso, nunca AegisName.
  # Todos os outros campos saem da descricao do bRO, por extenso
  # (`estado_item.py --id 600 --descricao`).
  #
  # ONDE SE GANHA: so na Roleta Magica da Sala Secreta da Ordem
  # (npc/guerra/sala_secreta_da_ordem.txt, prt_in 136,114), a 0,2% por
  # giro de 10 Moedas Novas. E o unico lugar do servidor inteiro.
