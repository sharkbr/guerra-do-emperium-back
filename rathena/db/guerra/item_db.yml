# =========================================================================
# OVERRIDES - 2026-08-02
# =========================================================================
#
# Terceira categoria deste arquivo, e a mais perigosa das tres. Vale ler a
# diferenca antes de acrescentar entrada aqui:
#
#   30000-30999   itens NOSSOS, inventados. ID que ninguem mais usa.
#   placeholders  itens REAIS que o nosso rAthena vendorizado nao tem.
#                 A entrada preenche uma lacuna - nao ha versao dele
#                 no db/re/ para atropelar.
#   OVERRIDES     itens que o rAthena TEM, e cuja versao dele nos
#                 substituimos de proposito. Aqui existem duas versoes
#                 do mesmo ID, e a nossa vence.
#
# Por que a nossa vence: o `Footer: Imports:` do db/re/item_db.yml faz este
# arquivo ser lido DEPOIS, e o db/re/item_db_equip.yml e importado ANTES
# daqui, na mesma lista.
#
# ID repetido e MESCLADO, nao substituido - conferido em
# src/map/itemdb.cpp, `ItemDatabase::parseBodyNode`. Ele faz
# `find(nameid)` e, se o item ja existe, reaproveita a entrada e so
# sobrescreve os campos que estao escritos aqui. Duas consequencias, e as
# duas contra-intuitivas:
#
#   - campo OMITIDO aqui MANTEM o valor do db/re/. Nao volta ao padrao do
#     rAthena. Entao o override so precisa listar aquilo em que discordamos
#     - mas precisa listar TUDO em que discordamos, porque o que sobrar do
#     item deles fica.
#   - `Locations` e OR (`item->equip |= constant`), nao atribuicao. Nao da
#     para tirar um slot omitindo-o; so passando `false` explicito.
#
# **Ao atualizar o rathena/, esta secao e a primeira a conferir**, junto com
# a dos placeholders. Sao dois riscos diferentes:
#
#   - placeholder um dia some, quando o vendor trouxer o item de verdade -
#     e ate la a nossa casca vazia atropela a versao boa, calada;
#   - override nao some nunca (existe porque discordamos deles), mas se a
#     versao do rAthena ganhar um campo NOVO, esse campo vaza para dentro
#     do nosso item pela mesclagem, sem aviso.

  - Id: 400287
    # O bRO REBALANCEOU este item e o rebatizou. Nao e traducao: o kRO tem
    # "Legacy of Wise One", com bonus ELEMENTAIS e degraus de refino +7/+9;
    # o bRO tem "Capacete de Intensificacao", com bonus de RACA, pos-
    # conjuracao e degraus +10/+12. Mesmo ID, dois itens diferentes.
    #
    # A versao do bRO e a que vale aqui, e o motivo nao e preferencia: o
    # `itemInfo.lua` do cliente ja mostra a descricao do bRO (importada
    # pelo ferramentas/completa_iteminfo.py em 2026-08-01, entrada [400287]).
    # Manter os bonus do kRO no servidor faria a descricao MENTIR para o
    # jogador - ele leria "-20% de pos-conjuracao" e receberia resistencia
    # elemental. Entre trocar a descricao do cliente e trocar o efeito do
    # servidor, trocar o servidor e o lado barato e o lado certo.
    #
    # `AegisName` preservado de proposito, igual ao do db/re/: e o mesmo ID
    # e qualquer script que ja o referencie por nome continua valendo.
    AegisName: Legacy_of_Wise_One_J
    Name: Legacy of Wise One    # bRO: Capacete de Intensificacao
    Type: Armor
    # Peso 5 na descricao do bRO = 50 aqui (o cliente divide por 10). A
    # versao do kRO no db/re/ pesa 500, ou seja 50 na tela - mais uma
    # diferenca real entre os dois itens, nao erro de conversao.
    Weight: 50
    Defense: 10
    Slots: 1
    Locations:
      Head_Top: true
    ArmorLevel: 1
    EquipLevelMin: 100
    Refineable: true
    # `Classes: Todas` da descricao = ausencia de `Jobs:`, que no rAthena
    # ja significa todas.
    #
    # View 2260 DESTRAVADO em 2026-08-02. Ate essa data este item estava
    # fora do Mercado Contemporaneo justamente por causa dele: o 2260 nao
    # existia no `accessoryid.lub` do nosso GRF de 2021, e sem a entrada de
    # tabela o cliente nem sabe que esse slot de visual existe - o caso que
    # o `instala_visual.py` sozinho nao cura. Quem resolveu foi o
    # `ferramentas/estende_accessoryid.py`, que grava o override da tabela
    # em `cliente\data\`. Ver ferramentas/LEIAME.md.
    View: 2260
    Script: |
      .@r = getrefine();
      bonus bMdef,10;
      bonus bDelayrate,-20;
      bonus2 bSubClass,Class_Normal,20;
      bonus2 bSubClass,Class_Boss,20;
      if (.@r>=10) {
         bonus2 bSubRace,RC_Player_Human,13;
         bonus2 bSubRace,RC_Player_Doram,13;
         bonus2 bAddRace,RC_All,30;
         bonus2 bMagicAddRace,RC_All,30;
      }
      if (.@r>=12) {
         bonus bMaxHPrate,30;
         bonus bMaxSPrate,30;
      }

