###########################################################################
# Guerra do Emperium - Itens proprios
###########################################################################
#
# Este arquivo e NOSSO. Ele e encadeado a partir do `Footer: Imports:` de
# db/re/item_db.yml, que so ganhou uma linha apontando para ca.
#
# Por que aqui e nao em db/import/item_db.yml: o .gitignore do proprio
# rAthena ignora /db/import (rathena/.gitignore, linha 67). Um item
# definido la ficaria fora do git e sumiria num clone limpo.
#
# Faixa de IDs reservada para nos: 30000-30999 (medida livre em
# 2026-07-31, tanto no item_db do servidor quanto no itemInfo.lua do
# cliente). Vamos preenchendo de tras para frente.
#
###########################################################################

Header:
  Type: ITEM_DB
  Version: 3

Body:
  - Id: 30999
    AegisName: Maca_Da_Inocencia
    Name: Maçã da Inocência
    # Etc, e nao Usable, de proposito: a Maca nao e usada pelo jogador.
    # Quem a consome e o Mestre de UP (npc/guerra/mestre_de_up.txt).
    # Como Usable, o cliente ofereceria um botao de usar que nao faria
    # nada.
    Type: Etc
    Weight: 10
    # A Maca nao sai do personagem que a recebeu: sem chao, sem armazem,
    # sem troca, sem RoDEX, sem leilao, sem venda. Ela so tem um destino,
    # que e o Mestre de UP.
    # Cuidado ao mexer: `Override` (padrao 100) e o group_id que ignora
    # tudo isto. A conta de teste e group 99, entao ela SENTE as travas -
    # se um dia um GM de 100+ testar, nao vai sentir.
    Trade:
      NoDrop: true
      NoTrade: true
      # NoSell entrou em 2026-08-09, a pedido: sem ele a Maca aparecia na aba
      # de VENDA de qualquer NPC de loja. Nao ha risco do lado do Mestre de UP
      # - ele cobra com countitem/delitem, nao com itemshop, e e o itemshop que
      # passa a moeda pelo pc_can_sell_item e recusaria item NoSell.
      NoSell: true
      NoStorage: true
      NoGuildStorage: true
      NoMail: true
      NoAuction: true
      NoCart: true
    # Sem AliasName: o cliente agora conhece o 30999 de verdade. A entrada
    # [30999] do itemInfo.lua e posta pelo ferramentas/instala_item.py -
    # rodar de novo depois de trocar o cliente ou de mexer no texto.
    # O item nao tem arte propria: o `resourceName` da entrada e copiado
    # byte a byte do da Maca comum, entao o desenho e o mesmo sem custar
    # arquivo nenhum. Ate aqui o nome e a descricao ja sao os nossos.

  - Id: 30998
    AegisName: Moeda_Nova
    # Nome sem acento nenhum, e por sorte: `Moeda Nova` e ASCII puro. O
    # que o jogador le vem do itemInfo.lua do cliente, nao daqui - este
    # `Name` so aparece em log, @iteminfo e mensagem de GM.
    Name: Moeda Nova
    # A MOEDA DO REINO. E a moeda-corrente da Ordem, feita para ser o
    # preco dos servicos novos. Desde 2026-08-07 o circuito FECHA:
    #
    #   ONDE GASTAR  a Maquina (npc/guerra/maquina.txt) cobra a moeda em
    #                dezessete itens. Sao DUAS desde 2026-08-08 - prontera
    #                167,199 e comodo 215,185, a segunda um `duplicate`.
    #   DE ONDE VEM  1) o Logue e Ganhe (db/guerra/attendance.yml) entrega
    #                   10 por dia e 50 no vigesimo - 240 por CONTA por mes,
    #                   independente de jogar.
    #                2) a Alleria (npc/guerra/flores_da_ordem.txt, comodo
    #                   221,182) paga 1 por Flor Visionaria, desde
    #                   2026-08-08. E a fonte por ESFORCO, e nao tem teto:
    #                   a flor cai em 30% das mortes de chefe do Corredor
    #                   Fantasma.
    #
    # As outras duas fontes pensadas continuam POR FAZER, mas desde
    # 2026-08-08 as duas ja tem desenho, e nenhuma delas e fonte nova de
    # riqueza - as duas so CONVERTEM item que ja custou trabalho:
    #                3) a Moeda do Explorador (25737) a 10 por 1, na Maquina
    #                   de Troca da Ordem dos Exploradores (alberta 115,72).
    #                   Ver PENDENCIAS.md secao 1g.
    #                4) a Caveira Humana (30995), que espera o NPC que a
    #                   compra. Ver PENDENCIAS.md secao 4b.
    #
    # O premio do Logue e Ganhe chega por RoDEX, e o `NoMail` abaixo NAO
    # atrapalha: o itemdb_canmail so e checado quando um JOGADOR anexa
    # item (src/map/mail.cpp), e o correio do sistema e gerado direto.
    #
    # Etc, como toda moeda do rAthena (Moeda Manuk 6080, Moeda
    # Esplendor 6081): moeda nao se "usa", se gasta em NPC.
    Type: Etc
    # Peso 0, igual as moedas do rAthena. Moeda que pesa vira imposto
    # sobre quem acumula, e a fonte diaria (Logue e Ganhe) faz acumular.
    Weight: 0
    # Buy/Sell omitidos = 0 dos dois lados. `NoSell` e o que torna a
    # ultima linha da descricao literal: em NPC comum a moeda nem entra
    # na janela de venda, em vez de entrar valendo 0 zeny.
    #
    # O resto do bloco e o mesmo perfil da Moeda Manuk (6080), que e a
    # moeda-modelo do rAthena, com UMA diferenca: nao ha `NoStorage`, de
    # proposito. O jogador guarda a moeda no armazem dele, mas ela nao
    # sai do jogador - sem chao, sem troca, sem carrinho, sem armazem de
    # cla, sem RoDEX e sem leilao. Isso e o que segura a moeda de virar
    # mercadoria de mula: a renda e por cidadao (10/dia), entao trocavel
    # ela viraria renda por CONTA CRIADA.
    #
    # Se um dia a decisao for abrir economia de jogador em cima dela,
    # o passo e tirar `NoTrade` e `NoDrop` daqui - nao ha nada em
    # script dependendo da trava.
    #
    # Cuidado ao testar: a conta de teste e group 99 e SENTE estas
    # travas; um GM de group 100+ nao sente (`Override`, padrao 100).
    Trade:
      NoDrop: true
      NoTrade: true
      NoSell: true
      NoCart: true
      NoGuildStorage: true
      NoMail: true
      NoAuction: true
    # Sem arte propria: a entrada [30998] do itemInfo.lua copia o
    # `resourceName` da Moeda Manuk (6080) byte a byte, entao o desenho
    # e o da moeda dela. Quem poe a entrada e o
    # ferramentas/instala_item.py - rodar de novo depois de trocar o
    # cliente ou de mexer no texto da descricao.


  # ----- As duas caixas da Maquina - 2026-08-07 -------------------------
  #
  # Item nosso de ID nosso, como a Maca e a Moeda acima. Mas a razao de
  # existirem e diferente das duas, e vale registrar: elas nao sao itens
  # novos de jogo, sao EMBALAGEM.
  #
  # A loja de troca da Maquina (npc/guerra/barters_guerra.yml) cobra POR
  # UNIDADE - o rAthena nao tem campo de quantidade para o item vendido
  # numa loja de barter. "5 Bencoes por 1 Moeda" so existe se as 5
  # Bencoes forem UM item. Dezesseis das dezoito linhas daquela loja usam
  # caixa que o bRO ja tinha pronta; estas duas sao as que faltavam.
  #
  # Se um dia a Maquina deixar de ser loja de troca, estas duas perdem a
  # razao de ser junto com ela.
  #
  # As duas copiam arte de uma caixa existente (`arte_de` no
  # ferramentas/instala_item.py), entao nao ha arquivo de arte novo.

  - Id: 30997
    AegisName: Cx_Bencao_Do_Ferreiro_5
    Name: "Cx. Bênção do Ferreiro (5)"
    # A unica caixa da Maquina que o bRO nao tinha em tamanho nenhum que
    # servisse: la existem a de 2 e a `Blacksmith_Bless_Box_3` (101047),
    # e essa ultima entrega por `getgroupitem`, nao por `getitem`.
    # Copiamos a ARTE dela e nao o mecanismo - grupo de item traria a
    # incerteza de sorteio, que aqui nao faz sentido nenhum.
    Type: Usable
    # Peso 0 como a caixa de 3 do bRO. Caixa que se abre no ato nao
    # deveria cobrar pedagio de peso.
    Weight: 0
    # Mesmo perfil de travas das caixas irmas do bRO (13610, 16262...) e
    # da propria Moeda que a compra. Sem `NoStorage`, tambem como elas: o
    # jogador guarda no armazem dele, mas a caixa nao passa para outro.
    Trade:
      NoDrop: true
      NoTrade: true
      NoSell: true
      NoCart: true
      NoGuildStorage: true
      NoMail: true
      NoAuction: true
    # `getitem` direto, e nao `getgroupitem`: o conteudo e fixo.
    # Cuidado ao mexer - o 6635 e a Bencao do Ferreiro de verdade, e a
    # quantidade aqui e a unica coisa que sustenta o preco de 1 Moeda
    # na loja de troca. Mudar uma exige mudar a outra.
    Script: |
      getitem 6635,5;

  - Id: 30996
    AegisName: Cx_Pocao_De_Guyak_30
    Name: "Cx. Poção de Guyak (30)"
    # O bRO TEM uma caixa de Guyak - a `Guyak_Pudding_20_Box` (22668) -
    # e ela foi reprovada por duas razoes somadas, nao por uma:
    #
    #   1) traz 20, e a Maquina vende 30 por 3 Moedas;
    #   2) o nome dela no itemInfo.lua do cliente esta em COREANO. O item
    #      nao existe no bRO, entao nao ha nome em portugues para trazer,
    #      e a regra do CLAUDE.md secao 4.2 e clara: so entra na loja
    #      item com nome em portugues.
    #
    # A segunda sozinha ja bastaria.
    #
    # A ARTE JA FOI DELA E NAO E MAIS. Ate 2026-08-12 a caixa usava o
    # resourceName da 22668 - a caixa generica de consumivel, igual a
    # de meia duzia de irmas na mesma vitrine. A pedido, passou a usar
    # o da PROPRIA Pocao de Guyak (12710): a caixa tem a cara do que
    # tem dentro. As duas fontes dao "4 de 4 ok" no estado_item.py.
    #
    # Isso NAO se ve neste arquivo: resourceName e coisa do cliente, e
    # quem grava e ferramentas/instala_item.py, na tabela ITENS dele.
    Type: Usable
    Weight: 0
    Trade:
      NoDrop: true
      NoTrade: true
      NoSell: true
      NoCart: true
      NoGuildStorage: true
      NoMail: true
      NoAuction: true
    Script: |
      getitem 12710,30;

  - Id: 30995
    AegisName: Caveira_Humana
    Name: Caveira Humana
    # O TROFEU DA ARENA. Pedida em 2026-08-08 para cair de jogador morto
    # em PvP dentro da arena de Prontera.
    #
    # QUEM A ENTREGA: o OnPCKillEvent do npc/guerra/honra_de_combate.txt,
    # desde 2026-08-08, no mesmo bloco que pontua a morte. A condicao e
    # UMA desde 2026-08-30 - os dois lados em nivel 200 -, e e a mesma que
    # libera o ponto: onde sai um, sai o outro. Eram TRES ate ali; as
    # outras duas (o morto com 1 ponto de Honra ou mais, e a morte
    # passando pelo anti-conluio do .Limite) cairam em 2026-08-30 e
    # 2026-08-13. O cabecalho daquele arquivo, secao "O trofeu da arena",
    # conta as duas quedas.
    #
    # A DESCRICAO DO CLIENTE AINDA PROMETE "reputacao positiva", e desde
    # 2026-08-30 isso e mentira. O texto mora em ferramentas/instala_item.py
    # e ja foi corrigido la; chegar ao jogador exige rodar a ferramenta e
    # publicar patch (CLAUDE.md secao 4.18). Ver PENDENCIAS.md.
    #
    # O `NoDrop` abaixo NAO e so tematico: e ele que cumpre o "nunca no
    # chao". Com a mochila cheia o getitem tenta map_addflooritem, mas
    # passa antes por pc_candrop (src/map/script.cpp), que recusa item
    # NoDrop - entao a caveira se perde em vez de cair no chao.
    #
    # Ela tambem ja e citada de FORA: a descricao da Moeda Nova (30998), no
    # ferramentas/instala_item.py, lista "em troca de Caveira Humana" como
    # uma das fontes de moeda. Esse NPC de troca ainda nao existe.
    #
    # Etc, e nao Usable, pelo mesmo motivo da Maca da Inocencia: o jogador
    # nao usa a Caveira. Como Usable o cliente ofereceria um botao de usar
    # que nao faria nada.
    Type: Etc
    # Peso 0 a pedido: quem briga na arena nao pode ser punido por vencer.
    Weight: 0
    # Presa a quem matou: sem chao, sem troca, sem armazem, sem RoDEX, sem
    # leilao, sem carrinho e sem revenda em NPC.
    #
    # Cuidado ao mexer: `Override` (padrao 100) e o group_id que ignora tudo
    # isto. A conta de teste e group 99, entao ela SENTE as travas - se um
    # dia um GM de 100+ testar, nao vai sentir. Ver CLAUDE.md secao 4.7.
    Trade:
      NoDrop: true
      NoTrade: true
      NoSell: true
      NoStorage: true
      NoGuildStorage: true
      NoMail: true
      NoAuction: true
      NoCart: true
    # Sem AliasName: a entrada [30995] do itemInfo.lua e posta pelo
    # ferramentas/instala_item.py, e e de la que sai o nome e a descricao
    # que o jogador le. A arte e copiada byte a byte da Caveira comum
    # (7420, Skull_), que tem os 4 arquivos completos no GRF deste cliente -
    # entao a Caveira Humana nao custa arquivo de arte nenhum.

  # ----- O premio de guerra ---------------------------------------------
  #
  # POR QUE "Rolinho" E NAO "Bolinho": o nome pedido em 2026-08-13 foi
  # "Bolinho de Arroz", e ele JA ESTA OCUPADO TRES VEZES no itemInfo.lua
  # deste cliente - 555 (Rice_Cake), 564 e 7613 se chamam todos assim.
  # Nome repetido na bolsa e o que quebra a busca do jogador, entao valeu
  # a alternativa combinada no mesmo pedido. "Rolinho de Arroz" nao
  # aparece em nenhuma das 26972 entradas do itemInfo.lua.
  #
  # O ORIGINAL DO bRO EXISTE, E NAO E O 555. E o 14524
  # (Superb_Fish_Slice, que o cliente chama de "Biscoito de Arroz"), um
  # dos tres consumiveis de guerra do bRO: 14522 cura 100% de HP, 14523
  # cura 100% de SP e o 14524 cura os dois. Sao esses os numeros que este
  # item copia - percentheal 100,100, peso 10, sem bloco Delay e preso a
  # quem ganhou. O 555 entra so como ARTE, porque e ele que desenha o
  # bolinho de arroz e o nome pedido falava do desenho dele.
  #
  # A AUSENCIA DE `Delay:` E DE PROPOSITO, e e a decisao cara deste item.
  # O Fruto de Yggdrasil (607), o Tonico Dourado (12858) e o Sorvete de
  # Melao (23322) - os outros tres 100/100 alcancaveis - dividem o grupo
  # `Reuse_Limit_F` e por isso um trava o outro por 5 segundos. Este fica
  # FORA do grupo, a pedido: e premio de guerra. Quem for calibrar PvP
  # olhe aqui primeiro, porque cura total sem recarga vale enquanto durar
  # a pilha, e nada no jogo denuncia isso alem da pratica.
  #
  # O `NoDrop` NAO E SO TEMATICO, pelo mesmo motivo da Caveira Humana
  # (30995): e ele que impede o `getitem` de largar o premio no chao
  # quando a mochila do vencedor estiver cheia. Ver CLAUDE.md secao 5.
  # As travas sao as MESMAS SETE do 14524 - e nao as da Caveira, que tem
  # `NoStorage` a mais. Consumivel de guerra tem de caber no armazem da
  # Kafra entre uma guerra e outra; trofeu nao.
  #
  # AINDA NAO TEM QUEM O ENTREGUE. O item existe, cura e nao se perde, mas
  # nenhum NPC o paga: falta o gatilho no fim da guerra
  # (npc/guerra/horario_da_guerra.txt) ou um NPC de premiacao. Esta em
  # PENDENCIAS.md.
  - Id: 30994
    AegisName: Rolinho_De_Arroz
    Name: Rolinho de Arroz
    # Healing, e nao Usable, como o 14524: e comida, e o cliente mostra o
    # botao de usar que de fato faz alguma coisa.
    Type: Healing
    # 10 = 1,0 de peso na tela, a mesma conta da Maca da Inocencia (30999,
    # Weight 10 e "Peso: 1" na descricao). Copiado do 14524.
    Weight: 10
    # Sem `Buy`: a regra 4.16 do CLAUDE.md ("item com Buy entra na loja pelo
    # Buy") so vale para item de vitrine, e este nao vai para vitrine
    # nenhuma. Sem preco tambem nao ha revenda a Buy/2 - o `NoSell` abaixo
    # ja fecharia essa porta de qualquer jeito.
    #
    # As sete travas do consumivel de guerra do bRO, na ordem dele: sem
    # chao, sem troca, sem revenda em NPC, sem armazem de cla, sem RoDEX,
    # sem leilao e sem carrinho. O armazem PESSOAL fica liberado.
    Trade:
      NoDrop: true
      NoTrade: true
      NoSell: true
      NoGuildStorage: true
      NoMail: true
      NoAuction: true
      NoCart: true
    Script: |
      percentheal 100,100;

  # ----- A Tinta para Parede Infinita -----------------------------------
  #
  # O insumo que NAO acaba das sete habilidades de Trapaceiro/Renegado que
  # gastam Tinta para Parede (6123): Copia Explosiva, Pintar Armadilha,
  # Porta Dimensional, Simbolo do Caos, Redemoinho de Absorcao, Sede de
  # Sangue e Borrifar Tinta.
  #
  # ELA NAO E UMA MOEDA E NAO E GASTA. Quem a carrega tem o requisito de
  # Tinta ZERADO - a habilidade passa na checagem e nada e descontado. A
  # regra esta em src/custom/tinta_infinita.hpp e entra por uma linha no
  # skill_get_requirement (src/map/skill.cpp), do mesmo jeito que o rAthena
  # ja faz com o combustivel do Mado Gear duas linhas acima. Ver a secao 2
  # do CLAUDE.md.
  #
  # ELA NAO COBRE O PINCEL DE GRAFITE (6122) nem nada de Mascara - quem faz
  # isso e o Pincel do Infinito (30992), logo abaixo. Os dois itens tem
  # trabalhos separados de proposito: esta e a TINTA DE PAREDE, aquele sao
  # os dois PINCEIS mais a TINTA DE PELE. Sem o Pincel do Infinito, o 6122
  # continua exigido - ele e `Amount: 0` no skill_db, ou seja ferramenta e
  # nao custo (a habilidade pede que esteja no inventario e nunca o gasta),
  # e custa 10z na Tranqueiras.
  #
  # Type Etc, e nao Usable, pelo mesmo motivo da Maca da Inocencia: o
  # jogador nao usa esta Tinta. Ela so precisa estar no inventario, e um
  # botao de usar que nao faz nada so confundiria.
  #
  # AS TRAVAS SAO AS DA MACA (30999), e por ora sao de proposito: em
  # 2026-08-27 a decisao do dono foi "agora so a staff/fantasma, mas mais
  # pra frente ele pode se tornar um item objetivo de quest grande". Ou
  # seja isto aqui e o estado inicial, nao o final. Quando a quest existir,
  # o que muda e este bloco (afrouxar o Trade) e o NPC que a entrega - o
  # C++ nao muda, porque a regra la olha "tem o item?", nao como ele chegou.
  #
  # Lembrar da regra 4.7: a conta de teste (grupo 99) IGNORA as sete travas,
  # entao testar NoTrade nela sempre da falso negativo.
  #
  # O primeiro portador e o fantasma da arena (pvp_n_1-5), que lanca a
  # Copia Explosiva a cada volta do ciclo de combate - da ordem de oito mil
  # Tintas por dia se fosse pagar por elas. Ver ..\FANTASMA-BOT.md.
  #
  # FALTA O LADO DO CLIENTE: sem entrada no itemInfo.lua o item aparece
  # como "Unknown Item" na mochila (CLAUDE.md secao 5). Como hoje ele so
  # existe para a staff, isso nao chega a jogador nenhum - mas antes de a
  # quest existir, rodar ferramentas/instala_item.py e mandar por patch.
  - Id: 30993
    AegisName: Tinta_Parede_Infinita
    Name: Tinta para Parede Infinita
    Type: Etc
    Weight: 10
    Trade:
      NoDrop: true
      NoTrade: true
      NoSell: true
      NoStorage: true
      NoGuildStorage: true
      NoMail: true
      NoAuction: true
      NoCart: true

  # ----- O Pincel do Infinito --------------------------------------------
  #
  # O IRMAO DA TINTA INFINITA, e o mesmo mecanismo: quem o carrega tem TRES
  # requisitos zerados de uma vez, e o Pincel nunca e gasto -
  #
  #     6121  Pincel de Maquiagem  ferramenta das seis Mascaras (2292-2297)
  #     6122  Pincel de Grafite    ferramenta das sete Pinturas (2289, 2299-2304)
  #     6120  Tinta para Pele      insumo GASTO, 1 por Mascara lancada
  #
  # A regra esta em src/custom/pincel_do_infinito.hpp e entra na MESMA linha
  # do skill_get_requirement em que entra a Tinta Infinita (src/map/skill.cpp).
  # Ver a secao 2 do CLAUDE.md.
  #
  # A TINTA PARA PAREDE (6123) NAO ESTA NA LISTA, de proposito: ela continua
  # sendo trabalho da Tinta para Parede Infinita (30993). Quem quiser lancar
  # Copia Explosiva sem gastar nada carrega os DOIS itens - antes eram
  # quatro (6120, 6121, 6122 e 6123).
  #
  # POR QUE A FERRAMENTA TAMBEM PRECISA DE ISENCAO, que e a parte que
  # engana: `Amount: 0` no skill_db nao quer dizer "opcional". O
  # skill_check_condition_castbegin (src/map/skill.cpp:9559) reprova por
  # `index[i] < 0` antes de olhar a quantidade - sem o pincel na mochila a
  # habilidade falha com o mesmo "item necessario nao encontrado" de quando
  # falta tinta. Zerar o itemid tira as duas exigencias de uma vez.
  #
  # Type Etc, e nao Usable, pelo mesmo motivo da Maca e da Tinta: o jogador
  # nao usa este Pincel, ele so precisa estar no inventario.
  #
  # AS TRAVAS SAO AS DA TINTA (30993), e pelo mesmo motivo - hoje so a
  # staff, e o mesmo caminho de virar objetivo de quest mais para a frente
  # sem que o C++ mude, porque a regra la olha "tem o item?" e nao como ele
  # chegou. Lembrar da regra 4.7: a conta de teste (grupo 99) IGNORA as sete
  # travas.
  #
  # O primeiro portador e o fantasma da arena (pvp_n_1-5), que desde
  # 2026-08-28 lanca a Mascara da Vulnerabilidade a cada volta do ciclo e a
  # Mascara da Tolice quando leva golpe pesado - sem esta isencao, uma Tinta
  # para Pele por lance, reposta a mao para sempre. Ver ..\FANTASMA-BOT.md.
  #
  # LADO DO CLIENTE: entrada propria no itemInfo.lua e ARTE PROPRIA, as duas
  # postas por ferramenta - `instala_item.py` (o texto) e `doura_arte.py` (o
  # pincel dourado, recolorido a partir do 6121). E mudanca de CLIENTE, ou
  # seja vai por PATCH e nao pelo implanta.sh (RECEITAS.md secao 0).
  - Id: 30992
    AegisName: Pincel_Do_Infinito
    Name: Pincel do Infinito
    Type: Etc
