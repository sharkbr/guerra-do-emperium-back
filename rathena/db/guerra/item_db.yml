# -------------------------------------------------------------------------
# SEGUNDA LEVA DE PLACEHOLDERS - 2026-08-04
# -------------------------------------------------------------------------
#
# Mesma categoria e mesmo metodo das de cima: itens REAIS do bRO que o nosso
# vendor nao conhece, cada um no seu ID oficial, com os bonus lidos da
# descricao do `iteminfo_new.lub` do bRO.
#
# Uma nota de PESO, que vale para toda entrada nova daqui para a frente:
#
#   O `Weight` do item_db e DECIMO DE UNIDADE. O cliente divide por 10 ao
#   desenhar, entao "Peso: 65" na tela = `Weight: 650` aqui - a mesma regra
#   que o override do 400287 anota logo abaixo, e que o 19443 do rAthena
#   prova (`Weight: 300` -> "Peso: 30" na tela).
#
#   As cinco entradas de 2026-08-01 (510155, 450120, 15371, 400687, 28572)
#   tinham copiado o numero da tela direto e pesavam um decimo do que
#   deviam. CORRIGIDAS em 2026-08-04, a pedido do dono do projeto, no
#   mesmo dia em que o erro foi encontrado.
#
#   Hoje o arquivo inteiro esta conferido contra o `iteminfo_new.lub` do
#   bRO: os 8 itens que declaram `Weight` batem. As 13 armas Brutais nao
#   declaram nenhum, e isso esta certo - elas pesam `0` no proprio bRO.
#   Para reconferir depois de mexer, o teste e ler o "Peso:" da descricao
#   de cada uma e comparar com `Weight / 10`.
#
# E uma licao que voltou da rodada de traducao, e vale para todo item:
#
#   NOME DE HABILIDADE NA DESCRICAO NAO SE TRADUZ DE MEMORIA. O
#   "[Impacto Meteoro]" da Adaga dos Orcs NAO e a Chuva de Meteoros do
#   Bruxo (WZ_METEOR) - e o `ASC_METEORASSAULT` do Algoz. Quem diz e o
#   `skillinfolist.lub` do GRF do bRO, que traz o par
#   ASC_METEORASSAULT -> "Impacto Meteoro" e WZ_METEOR -> "Chuva de
#   Meteoros". Errar aqui poe a magia errada na arma, e ninguem percebe.

