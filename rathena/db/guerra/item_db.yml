# =========================================================================
# OVERRIDES - 2026-08-02
# =========================================================================
#
# Terceira categoria deste arquivo, e a mais perigosa das tres. Vale ler a
# diferenca antes de acrescentar entrada aqui:
#
#   30000-30999   itens NOSSOS, inventados. ID que ninguem mais usa.
#   placeholders  itens REAIS que o nosso rAthena vendorizado nao tem.
#                 A entrada preenche uma lacuna - nao ha versao dele
#                 no db/re/ para atropelar.
#   OVERRIDES     itens que o rAthena TEM, e cuja versao dele nos
#                 substituimos de proposito. Aqui existem duas versoes
#                 do mesmo ID, e a nossa vence.
#
# Por que a nossa vence: o `Footer: Imports:` do db/re/item_db.yml faz este
# arquivo ser lido DEPOIS, e o db/re/item_db_equip.yml e importado ANTES
# daqui, na mesma lista.
#
# ID repetido e MESCLADO, nao substituido - conferido em
# src/map/itemdb.cpp, `ItemDatabase::parseBodyNode`. Ele faz
# `find(nameid)` e, se o item ja existe, reaproveita a entrada e so
# sobrescreve os campos que estao escritos aqui. Duas consequencias, e as
# duas contra-intuitivas:
#
#   - campo OMITIDO aqui MANTEM o valor do db/re/. Nao volta ao padrao do
#     rAthena. Entao o override so precisa listar aquilo em que discordamos
#     - mas precisa listar TUDO em que discordamos, porque o que sobrar do
#     item deles fica.
#   - `Locations` e OR (`item->equip |= constant`), nao atribuicao. Nao da
#     para tirar um slot omitindo-o; so passando `false` explicito.
#
# **Ao atualizar o rathena/, esta secao e a primeira a conferir**, junto com
# a dos placeholders. Sao dois riscos diferentes:
#
#   - placeholder um dia some, quando o vendor trouxer o item de verdade -
#     e ate la a nossa casca vazia atropela a versao boa, calada;
#   - override nao some nunca (existe porque discordamos deles), mas se a
#     versao do rAthena ganhar um campo NOVO, esse campo vaza para dentro
#     do nosso item pela mesclagem, sem aviso.

