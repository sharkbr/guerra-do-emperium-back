      getitem 12710,30;

  - Id: 30995
    AegisName: Caveira_Humana
    Name: Caveira Humana
    # O TROFEU DA ARENA. Pedida em 2026-08-08 para cair de jogador morto
    # em PvP - level maximo e reputacao positiva, dentro da arena de
    # Prontera. A descricao que o jogador le (itemInfo.lua) ja diz isso.
    #
    # QUEM A ENTREGA: o OnPCKillEvent do npc/guerra/honra_de_combate.txt,
    # desde 2026-08-08, no mesmo bloco que pontua a morte. Sao TRES
    # condicoes - os dois lados em nivel 200, o morto com 1 ponto ou mais
    # de Honra de Combate, e a morte tem de passar pelo anti-conluio do
    # .Limite. O cabecalho daquele arquivo, secao "O trofeu da arena",
    # explica por que a terceira existe sem ter sido pedida.
    #
    # O `NoDrop` abaixo NAO e so tematico: e ele que cumpre o "nunca no
    # chao". Com a mochila cheia o getitem tenta map_addflooritem, mas
    # passa antes por pc_candrop (src/map/script.cpp), que recusa item
    # NoDrop - entao a caveira se perde em vez de cair no chao.
    #
    # Ela tambem ja e citada de FORA: a descricao da Moeda Nova (30998), no
    # ferramentas/instala_item.py, lista "em troca de Caveira Humana" como
    # uma das fontes de moeda. Esse NPC de troca ainda nao existe.
    #
    # Etc, e nao Usable, pelo mesmo motivo da Maca da Inocencia: o jogador
    # nao usa a Caveira. Como Usable o cliente ofereceria um botao de usar
    # que nao faria nada.
    Type: Etc
    # Peso 0 a pedido: quem briga na arena nao pode ser punido por vencer.
    Weight: 0
    # Presa a quem matou: sem chao, sem troca, sem armazem, sem RoDEX, sem
    # leilao, sem carrinho e sem revenda em NPC.
    #
    # Cuidado ao mexer: `Override` (padrao 100) e o group_id que ignora tudo
    # isto. A conta de teste e group 99, entao ela SENTE as travas - se um
    # dia um GM de 100+ testar, nao vai sentir. Ver CLAUDE.md secao 4.7.
    Trade:
      NoDrop: true
      NoTrade: true
      NoSell: true
      NoStorage: true
      NoGuildStorage: true
      NoMail: true
      NoAuction: true
      NoCart: true
    # Sem AliasName: a entrada [30995] do itemInfo.lua e posta pelo
    # ferramentas/instala_item.py, e e de la que sai o nome e a descricao
    # que o jogador le. A arte e copiada byte a byte da Caveira comum
    # (7420, Skull_), que tem os 4 arquivos completos no GRF deste cliente -
    # entao a Caveira Humana nao custa arquivo de arte nenhum.

# =========================================================================
# PLACEHOLDERS DO MERCADO CONTEMPORANEO - 2026-08-01
# =========================================================================
#
# ATENCAO: daqui para baixo os IDs estao FORA da nossa faixa 30000-30999,
# e isso e deliberado. Nao sao itens nossos: sao itens REAIS do kRO/bRO que
# o nosso rAthena vendorizado ainda nao conhece. Cada um esta no seu ID
# oficial, o mesmo que o bRO usa.
#
# Como isso foi descoberto: o mercado (npc/guerra/mercado_contemporaneo.txt)
# foi montado a partir de uma lista de nomes em portugues. A tabela
# id -> nome do bRO foi lida do `iteminfo_new.lub` da instalacao do
# Ragnarok Brazil desta maquina (18845 itens) - ver ferramentas/LEIAME.md,
# secao do `completa_iteminfo.py`. Cruzando essa tabela com o nosso
# item_db_equip.yml, 18 itens da lista simplesmente nao existiam aqui.
#
# PREENCHIDAS EM 2026-08-01. Quando esta secao nasceu, de manha, as 18
# entradas eram casca vazia - `# TODO bonus` em todas, e equipar nao fazia
# nada. A decisao de nao inventar efeito continua valendo; o que mudou e
# que **nao foi preciso inventar**: a descricao completa de cada item, com
# os numeros e cada bonus por extenso, estava no `iteminfo_new.lub` do bRO.
#
# De onde veio cada coisa:
#
#  | numero              | fonte                                          |
#  |---------------------|------------------------------------------------|
#  | ATQ, DEF, peso...   | as linhas "Tipo:/ATQ:/Peso:" da descricao      |
#  | os bonus            | as linhas de efeito da mesma descricao         |
#  | Range, Jobs, slot   | um item vizinho do mesmo SubType no rAthena    |
#  | forma do Script     | o Blut_Axe (1328), que o vendor JA tinha       |
#
# O ultimo item e o que deu confianca ao resto: **duas das quinze armas
# Brutais ja existiam no rAthena** (Blut_Axe 1328 e Blut_Spear 32014), com
# o script escrito por eles. As treze que faltavam seguem o mesmo molde,
# com os numeros que a descricao do bRO manda. Nao e traducao livre: e
# preencher a lacuna de uma familia que ja estava meio implementada.
#
# ONDE AINDA HA `# TODO`: efeito que o rAthena nao expressa com `bonus`,
# e bonus de CONJUNTO. Conjunto exige a outra peca do set, que em geral
# nem esta no servidor - implementar so a metade daria bonus fantasma.
# Cada TODO cita a linha em portugues que ficou de fora, para nao ser
# preciso reabrir a descricao para saber o que falta.
#
# O `AegisName` e o `Name` em ingles sao NOSSOS e provisorios. A linha
# "Brutal" do bRO e a familia `Blut_` do rAthena (Blut_Axe 1328 e
# Blut_Spear 32014 ja existiam no vendor), entao os treze que faltavam
# seguem o mesmo prefixo. Se um dia o rAthena trouxer estes itens de
# verdade, o `Footer: Imports:` faz o NOSSO arquivo ser lido DEPOIS do
# db/re/item_db.yml - entao estas entradas venceriam a versao boa, calado.
# **Ao atualizar o rathena/, conferir esta secao antes de qualquer coisa.**
#
# Peso 0 nas treze Brutais nao e descuido: e o que a descricao do bRO diz
# ("Peso: 0"). A familia inteira e sem peso.

  # ----- Linha Brutal (bRO "Brutal", familia Blut_ do rAthena) ----------
  #
  # O vendor so tinha 2 dos 15: Blut_Axe (1328) e Blut_Spear (32014). As
  # treze abaixo completam a linha, no molde do 1328.
  #
  # A familia inteira compartilha um esqueleto, e so tres coisas variam
  # de arma para arma: o dano base contra Humano/Doram, se tem ou nao a
  # resistencia de 30%, e um efeito exclusivo em quatro delas.
  #
  #   .@r = getrefine();
  #   bonus bUnbreakableWeapon;                    # todas menos a 28248
  #   bonus2 bSubRace,RC_Player_(Human|Doram),30;  # so em algumas
  #   bonus2 bAddRace,RC_Player_(Human|Doram),N;   # N varia: 25 a 95
  #   bonus2 bIgnoreDefRaceRate,RC_All,5*.@r;
  #   +8: mais 35   |   +9: mais 20   |   +10: HP e SP max +15%
  #
  # Todas: peso 0, nivel de arma 4, nivel minimo 100, sem slot.
  #
  # O 28248 (Lanca-Granadas) e o unico SEM `bUnbreakableWeapon`, e nao e
  # esquecimento meu: a descricao do bRO nao traz a linha "Indestrutivel
  # em batalha" que todas as outras doze trazem. Mantido como esta la.

  - Id: 13147
    AegisName: Blut_Revolver
    Name: Brute Revolver          # bRO: Pistola Brutal
    Type: Weapon
    SubType: Revolver
    Attack: 70
    Range: 7
    Jobs:
      Gunslinger: true
      Rebellion: true
    Classes:
      All_Third: true
      Fourth: true
    Locations:
      Both_Hand: true
    WeaponLevel: 4
    EquipLevelMin: 100
    Refineable: true
    Script: |
      .@r = getrefine();
      bonus bUnbreakableWeapon;
      bonus2 bSubRace,RC_Player_Human,30;
      bonus2 bSubRace,RC_Player_Doram,30;
      bonus2 bAddRace,RC_Player_Human,50;
      bonus2 bAddRace,RC_Player_Doram,50;
      bonus2 bIgnoreDefRaceRate,RC_All,5*.@r;
      if (.@r>=8) {
         bonus2 bAddRace,RC_Player_Human,35;
         bonus2 bAddRace,RC_Player_Doram,35;
      }
      if (.@r>=9) {
         bonus2 bAddRace,RC_Player_Human,20;
         bonus2 bAddRace,RC_Player_Doram,20;
      }
      if (.@r>=10) {
         bonus bMaxHPrate,15;
         bonus bMaxSPrate,15;
      }

