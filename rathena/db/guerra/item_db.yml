  - Id: 600
    AegisName: Zilant_Tarot_Deck
    Name: "Álbum de Cartas de Tarô"
    # DelayConsume e EXIGENCIA do `itemskill`, nao gosto: o buildin so
    # funciona neste tipo (doc/script_commands.txt, *itemskill). Ele poe
    # DELAYCONSUME_TEMP no flag.delay_consume (itemdb.cpp:1124), que e o
    # que impede o pc_useitem de apagar o item no duplo-clique.
    Type: DelayConsume
    # 220 = "Peso: 22" na tela - cada 10 e 1 de peso, a mesma conta do
    # Rolinho de Arroz mais acima. O 22 e o da descricao do bRO.
    Weight: 220
    # "Nivel necessario: 100", da mesma descricao.
    EquipLevelMin: 100
    # "Recarga: 1 segundo". O campo e em MILISSEGUNDOS, apesar de o
    # comentario do db/re/item_db.yml dizer "in seconds": o
    # `item->delay.duration` e somado a um tick de gettick(), que e ms.
    # Sem `Status:` de proposito - a recarga e so deste item, e nao de um
    # grupo compartilhado como o `Reuse_Limit_Mtf` dos quatro disfarces
    # que a mesma Roleta entrega.
    Delay:
      Duration: 1000
    # A outra metade do par. Sem esta linha o Album sumiria depois da
    # primeira conjuracao: e o DELAYCONSUME_NOCONSUME que segura o
    # pc_delitem la no fim (skill.cpp:8310).
    Flags:
      NoConsume: true
    Script: |
      callfunc "F_AlbumDeTaro";

