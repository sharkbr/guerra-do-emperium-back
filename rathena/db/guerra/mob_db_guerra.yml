###########################################################################
# Guerra do Emperium - ajustes pontuais de combate no mob_db
###########################################################################
#
# NAO CONFUNDIR com db/guerra/mob_db.yml, o vizinho: aquele e GERADO por
# ferramentas/traduz_ptbr.py monstros e reescrito inteiro a cada rodada -
# so tem JapaneseName. Este aqui e escrito a mao e nunca e tocado por
# ferramenta nenhuma; existe para o resto do mob_db (ataque, defesa,
# qualquer campo de combate) quando um NPC nosso precisa mudar um numero
# sem editar o arquivo do rAthena.
#
# Entrou por causa de UM campo: Id 1287 (Soldier Guardian), Attack. Em
# 2026-08-14 ganhou mais tres (AttackDelay, AttackMotion, ClientAttackMotion) e
# um quarto emprestado (Dex) - ver a secao "VELOCIDADE E PRECISAO" mais abaixo.
#
###### Por que via mob_db, e nao setunitdata no script #####################
#
# npc/guerra/senha_da_sala_secreta.txt spawna este guardiao com monster()
# comum, fora de castelo, e queria ATQ media 5.000 por script, com
# setunitdata(UMOB_ATKMIN/UMOB_ATKMAX). NAO FUNCIONA, e o motivo esta em
# src/map/script.cpp: o handler de UMOB_ATKMIN/UMOB_ATKMAX escreve em
# `md->base_status->rhw.atk` e dispara um recalculo com
# `status_db.getSCB_BATTLE()` - e SCB_BATTLE EXCLUI SCB_BASE de proposito
# (`SCB_BATTLE.set(); SCB_BATTLE.reset(SCB_BASE);`, src/map/status.hpp).
# `status_calc_mob_` - a funcao que copia `base_status` para `status`, o
# que o combate de fato le (`status_get_status_data` devolve `&md->status`,
# NAO `&md->base_status`) - so roda `if (flag[SCB_BASE])`. Ou seja o
# `setunitdata` grava no lugar errado e o recalculo que ele mesmo dispara
# nunca copia aquilo para onde o dano e calculado. Medido em jogo em
# 2026-08-15: com ATKMIN/ATKMAX configurados para 40.000-60.000 por
# script, o guardiao bateu como se nada tivesse mudado (menos de 2.000 de
# dano, perto do `Attack: 873` original do mob_db).
#
# UMOB_HP/UMOB_MAXHP funcionam porque o handler deles chama
# `status_set_hp`/`status_set_maxhp`, que escrevem direto no status vivo -
# nao dependem do recalculo. UMOB_DAMAGETAKEN funciona porque
# `md->damagetaken` e um campo solto no `mob_data`, lido direto pelo
# `battle_calc_damage` - tambem nao passa por base_status/status. So o ATQ
# tem esse problema, e so por isso ele saiu do script e veio pra ca: o
# `Attack` do mob_db E lido corretamente no SPAWN (o `status_calc_mob_`
# que roda ali usa `status_calc_mob(md, SCO_FIRST)`, que E `getSCB_ALL()`,
# com SCB_BASE incluido - o caminho normal, nao o do setunitdata).
#
###### O numero ##############################################################
#
# Pedido do dono, depois de testar em jogo (2026-08-15): "por volta de 5
# mil de dano". `status_base_atk_min`/`_max` (src/map/status.cpp) tiram
# min/max de 80%/120% do `Attack` do mob_db - `Attack: 5000` da 4.000 a
# 6.000, media 5.000.
#
###### Isto NAO toca os guardioes de castelo de verdade #####################
#
# O Id 1287 tambem e o "Soldado" dos guardioes reais (guardioes_dos_
# castelos.txt, Gerente do Castelo). Aqueles passam por
# src/custom/guardiao_do_castelo.hpp, que ESCREVE `status->rhw.atk`/`atk2`
# a partir de `conf/guerra/battle_guerra.txt` (`guardiao_atk_base`/
# `_passo`/`_max`), IGNORANDO por completo o `Attack` do mob_db - e essa
# escrita acontece toda vez que o guardiao nasce, absoluta, nao somada.
# Mudar o `Attack` daqui nao muda nada la; so importa para quem spawnar
# 1287 SEM passar pela escala (hoje, so o teste do guardiao).
#
###### VELOCIDADE E PRECISAO - pedido do dono, 2026-08-14 ##################
#
# O guardiao do teste (npc/guerra/senha_da_sala_secreta.txt) tinha HP e
# reducao certos mas nascia com a velocidade e a precisao PADRAO do mob_db
# (AttackDelay 1288/AttackMotion 288, uns 0,8 golpe por segundo; Hit
# 56+103+150 = 309) porque setunitdata(UMOB_HIT/UMOB_AMOTION/UMOB_ADELAY) tem
# o MESMO bug do ATQ (ver a secao de cima) e Hit nem e campo do mob_db - so
# sai de nivel+DEX (CLAUDE.md secao 5, "no renewal a chance de acerto..."). O
# pedido de hoje e casar com o patamar 100 da escala de castelo de verdade
# (conf/guerra/battle_guerra.txt / src/custom/guardiao_do_castelo.hpp):
# ASPD 178 e precisao na faixa 550-600. ATQ continua em 5.000 (nao 50.000 -
# o guardiao de castelo de verdade e mais forte de proposito) e a reducao
# continua em 90% (o mesmo "50% multiplicado pelos 80% da guerra" que da a
# escala real, ja implementado abaixo no script).
#
# ASPD -> AttackDelay/AttackMotion: MESMA FORMULA do guardiao_do_castelo.hpp
# (o cabecalho de la explica por extenso). amotion = 2000 - ASPD*10; adelay =
# amotion*2. ASPD 178 -> amotion 220, adelay 440 - os MESMOS numeros que a
# escala de castelo usa no patamar 10 (nao e coincidencia, e o mesmo alvo).
# ClientAttackMotion foi igualado ao AttackMotion pelo mesmo motivo do
# `status->clientamotion = amotion` do .hpp: o Soldado nasce com 624 no
# cliente, e deixado assim a animacao ficaria mais lenta que os golpes de
# verdade.
#
# Precisao -> Dex: nao ha campo de Hit no mob_db, so Dex (Hit = nivel + Dex +
# 150 para BL_MOB, src/map/status.cpp:2635 - conferido, e o mesmo numero que
# CLAUDE.md secao 5 ja registrava para este monstro, 309, com o Dex original
# de 103). Dex: 369 da Hit = 56 + 369 + 150 = 575, no meio da faixa pedida.
# CONFERIDO que Dex de monstro nao entra em outra formula que nos importe
# aqui (status.cpp: so PC usa dex em mdef2/flee2/critical; BL_MOB usa dex so
# no Hit da linha 2635) - subir o Dex nao muda mais nada neste guardiao.
#
# NADA DISTO TOCA OS GUARDIOES DE CASTELO DE VERDADE, pela mesma razao do
# Attack: eles passam por guardiao_do_castelo.hpp, que escreve
# status->amotion/adelay/hit de forma ABSOLUTA a partir da conf, por cima do
# que quer que o mob_db (ou este arquivo) tenha posto.
#
###########################################################################

Header:
  Type: MOB_DB
  Version: 5

Body:
  - Id: 1287
    Attack: 5000
    AttackDelay: 440
    AttackMotion: 220
    ClientAttackMotion: 220
    Dex: 369
